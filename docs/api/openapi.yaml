  /v1/asset-workbench/upload-sessions:
    post:
      summary: Create asset workbench upload session
      description: Creates a direct-upload session. Files no larger than the configured OSS part size use a single PUT; larger files use multipart upload. When upload directories are configured, `upload_directory_id` is required and the session stores the directory name, prefix, and difficulty snapshot. `file_hash` is optional metadata and is not required before upload starts.
      tags: [AssetWorkbench, ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: bearer_authenticated
        required_roles: [AssetSubmitter, AssetManager, SuperAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [original_filename, file_size, mime_type]
              properties:
                original_filename: { type: string }
                file_size: { type: integer, minimum: 1 }
                mime_type: { type: string }
                file_hash: { type: string }
                upload_directory_id: { type: integer }
                upload_batch_id: { type: string }
                relative_path:
                  type: string
                  description: Browser folder-upload path such as folder/sub/file.jpg. Backend normalizes and rejects unsafe segments.
                is_folder_upload: { type: boolean }
                expected_business_month:
                  type: string
                  pattern: '^[0-9]{4}-[0-9]{2}$'
      responses:
        '201':
          description: Created upload session and upload plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session: &AssetWorkbenchUploadSessionRow
                        type: object
                        properties:
                          id: { type: integer }
                          session_id: { type: string }
                          status: { type: string }
                          object_key: { type: string }
                          upload_directory_id: { type: integer, nullable: true }
                          upload_directory_name: { type: string }
                          upload_directory_prefix: { type: string }
                          upload_directory_difficulty_class: { type: string }
                          upload_batch_id: { type: string }
                          relative_path: { type: string }
                          is_folder_upload: { type: boolean }
                          expected_business_month: { type: string }
                          original_filename: { type: string }
                          file_size: { type: integer }
                          mime_type: { type: string }
                          file_hash: { type: string }
                          upload_id: { type: string }
                      plan:
                        type: object
                        description: OSS direct plan. `mode=single_part` provides `upload_url`; `mode=multipart` provides `upload_id`, `part_size`, and ordered `parts`.
                        additionalProperties: true
        '400': { description: Invalid request }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
