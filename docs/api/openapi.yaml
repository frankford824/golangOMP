    CreateTaskAssetUploadSessionRequest:
      type: object
      description: |
        `task_id` is required on the top-level `/v1/assets/upload-sessions` route and ignored on task-scoped compatibility routes.
        New frontend integrations should send one upload intent and let the backend choose `upload_strategy`.
        `asset_kind` and `asset_type` are equivalent inputs; `asset_kind` is the canonical frontend-facing name.
        `upload_mode` is compatibility-only and must not be used by new frontend integrations as strategy selector.
        Files no larger than the configured OSS part size use single-part upload; larger files use multipart regardless of asset kind.
        `source_asset_id` is used for backend-owned preview/thumb derivatives and links them to a source asset.
        For multi-SKU batch tasks, non-reference uploads must pass `target_sku_code` to bind the uploaded
        design asset to one child SKU.
        Asset-center upload sessions prefer `oss_direct` instructions and return `remote` only as a fallback.
        Frontend uploads bytes using the returned plan, then calls `complete`.
        Source and final uploads are staged and become business resources only through submit-design
        or audit decision. Tasks in `Completed` reject create, complete, and cancel mutations with
        `completed_resource_requires_reopen`; the task must be reopened before any resource change.
        Authorization uses explicit capabilities plus stable department/team ID scope. Legacy roles
        and organization display names never authorize this operation.
      anyOf:
        - required: [expected_size]
        - required: [file_size]
      properties:
        task_id:
          type: integer
          nullable: true
          description: Required on `POST /v1/assets/upload-sessions`; ignored on task-scoped compatibility routes where task context comes from path.
        created_by:
          type: integer
          deprecated: true
          description: Deprecated and ignored. The backend always uses the authenticated session actor.
        asset_id:
          type: integer
          nullable: true
          description: Existing technical design-asset root when adding another staged version. Completed tasks reject the request and require reopen.
        source_asset_id:
          type: integer
          nullable: true
          description: Optional linkage to a source asset. Allowed for `preview` and `design_thumb` intents.
        asset_type:
          type: string
          enum: [reference, source, delivery, preview, design_thumb]
          description: Compatibility alias of `asset_kind` retained for migration safety.
        asset_kind:
          type: string
          enum: [reference, source, delivery, preview, design_thumb]
          description: Canonical upload intent field for new frontend integrations.
        upload_mode:
          $ref: '#/components/schemas/DesignAssetUploadMode'
          description: Compatibility-only input. New frontend integrations must not send this field.
        filename:
          type: string
          description: Compatibility alias of `file_name`. At least one of `file_name` or `filename` must be provided.
        file_name:
          type: string
          description: Canonical file name field for new frontend integrations. At least one of `file_name` or `filename` must be provided.
        expected_size:
          type: integer
          format: int64
          minimum: 1
          maximum: 1073741824
          description: Required exact file size in bytes. Task asset upload sessions reject values above 1 GiB and completion verifies the OSS object length.
        file_size:
          type: integer
          format: int64
          minimum: 1
          maximum: 1073741824
          description: Compatibility alias of `expected_size`; when used it must be the exact positive file size.
        mime_type:
          type: string
          description: Optional MIME hint.
        file_hash:
          type: string
        remark:
          type: string
        reason:
          type: string
          description: Business reason. Required by the audit post-close supplement upload route.
        target_sku_code:
          type: string
          description: Required for multi-SKU batch-task non-reference uploads. Backend validates that the SKU belongs to the task, returns it on the upload-session business view as `target_sku_code`, and persists the completed asset scope on `scope_sku_code` for the asset root and asset version.
        retouch_requirement_id:
          type: integer
          format: int64
          nullable: true
          description: Optional P图需求明细 scope for `retouch_task`. Mutually exclusive with `target_sku_code`. Backend validates ownership and persists the scope on upload session, `design_assets`, and `task_assets`.
    CreateTaskAssetUploadSessionResponseData:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/UploadSession'
        remote:
          $ref: '#/components/schemas/RemoteUploadSessionPlan'
        oss_direct:
          $ref: '#/components/schemas/OSSDirectUploadPlan'
        upload_strategy:
          type: string
          description: Canonical frontend-facing upload strategy label. Current runtime emits `single_part` or `multipart`; `single_part` corresponds to internal `upload_mode=small`.
        required_upload_content_type:
          type: string
          description: Exact `Content-Type` value that the browser must send on OSS direct PUT and echo on `complete` as `upload_content_type`.
        complete_endpoint:
          type: string
          description: Canonical completion endpoint returned by the session creator.
        cancel_endpoint:
          type: string
          description: Canonical cancellation endpoint returned by the session creator.
    CreateAssetUploadSessionRequestCanonical:
      allOf:
        - $ref: '#/components/schemas/CreateTaskAssetUploadSessionRequest'
        - type: object
          required: [task_id, asset_kind, expected_size]
          properties:
            task_id:
              type: integer
              minimum: 1
            asset_kind:
              type: string
              enum: [reference, source, delivery, preview, design_thumb]
            file_name:
              type: string
              minLength: 1
            filename:
              type: string
              minLength: 1
          anyOf:
            - required: [file_name]
            - required: [filename]
    CompleteTaskAssetUploadSessionRequest:
      type: object
      properties:
        completed_by:
          type: integer
          deprecated: true
          description: Deprecated and ignored. The backend always uses the authenticated session actor.
        file_hash:
          type: string
        upload_content_type:
          type: string
          description: Exact `required_upload_content_type` echoed back by the client when finalizing an OSS direct upload.
        oss_object_key:
          type: string
          description: Required for every OSS direct completion. The backend validates that it belongs to this upload session.
        oss_upload_id:
          type: string
          description: Required together with `oss_parts` for multipart completion; omitted for single-part completion.
        oss_parts:
          type: array
          description: Ordered multipart ETags; omitted for single-part completion.
          items:
            type: object
            required: [part_number, etag]
            properties:
              part_number: { type: integer, minimum: 1 }
              etag: { type: string }
        remark:
          type: string
        reason:
          type: string
          description: Optional reason override for audit post-close supplement completion. When omitted, the reason captured during create-session is used.
    CompleteTaskAssetUploadSessionResponseData:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/UploadSession'
        asset:
          $ref: '#/components/schemas/DesignAsset'
        version:
          $ref: '#/components/schemas/DesignAssetVersion'
    CancelTaskAssetUploadSessionRequest:
      type: object
      properties:
        cancelled_by:
          type: integer
          deprecated: true
          description: Deprecated and ignored. The backend always uses the authenticated session actor.
        remark:
          type: string
        oss_object_key:
          type: string
          description: Direct-upload object key returned by the session plan. Used for validated cleanup.
        oss_upload_id:
          type: string
          description: Multipart upload id returned by the session plan. Used to abort unfinished multipart data.
    CreateTaskReferenceUploadSessionRequest:
      type: object
      required: [filename, expected_size]
      description: Creates one canonical pre-task reference upload session. The backend chooses single-part or multipart OSS direct upload from `expected_size`.
      properties:
        created_by:
          type: integer
          deprecated: true
          description: Deprecated and ignored. The backend always uses the authenticated session actor.
        filename:
          type: string
        expected_size:
          type: integer
          format: int64
          minimum: 1
          maximum: 314572800
          description: Required exact file size in bytes. Pre-task reference uploads reject values above 300 MB and verify the final OSS object length.
        mime_type:
          type: string
        file_hash:
          type: string
        remark:
          type: string
    CreateTaskReferenceUploadSessionResponseData:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/UploadSession'
        remote:
          $ref: '#/components/schemas/RemoteUploadSessionPlan'
        oss_direct:
          $ref: '#/components/schemas/OSSDirectUploadPlan'
        complete_endpoint:
          type: string
        cancel_endpoint:
          type: string
    CompleteTaskReferenceUploadSessionRequest:
      type: object
      properties:
        completed_by:
          type: integer
          deprecated: true
          description: Deprecated and ignored. The backend always uses the authenticated session actor.
        file_hash:
          type: string
        upload_content_type:
          type: string
        oss_upload_id:
          type: string
        oss_object_key:
          type: string
        oss_parts:
          type: array
          items:
            type: object
            required: [part_number, etag]
            properties:
              part_number: { type: integer, minimum: 1 }
              etag: { type: string }
        remark:
          type: string
    CompleteTaskReferenceUploadSessionResponseData:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/UploadSession'
        reference_file_ref:
          type: string
          description: Compatibility ref id. New integrations should use `ref_object` and object arrays in `POST /v1/tasks`.
        storage_ref:
