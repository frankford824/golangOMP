          type: string
          enum: [available, historical_unavailable]
          description: historical_unavailable preserves immutable revision metadata for an object proven missing before V8 migration; preview and download URLs are omitted.
        unavailable_reason:
          type: string
          enum: [legacy_original_object_missing]
          description: Stable reason code when availability is historical_unavailable; clients localize the user-facing explanation.
        download_url: { type: string }
        preview_url: { type: string }
        download_expires_at: { type: string, format: date-time, nullable: true }
    TaskAssetGroupRevisionReference:
      type: object
      required: [id, revision_id, reference_file_ref_id, sort_order, ref_id, created_at]
      properties:
        id: { type: integer, format: int64 }
        revision_id: { type: integer, format: int64 }
        reference_file_ref_id: { type: integer, format: int64 }
        formal_task_asset_id: { type: integer, format: int64, nullable: true }
        sort_order: { type: integer }
        ref_id: { type: string }
        file_name: { type: string }
        scope: { type: string }
        mime_type: { type: string }
        file_size: { type: integer, format: int64, nullable: true }
        availability:
          type: string
          enum: [available, historical_unavailable]
          description: historical_unavailable preserves the immutable reference snapshot but suppresses preview and download URLs.
        unavailable_reason:
          type: string
          enum: [legacy_original_object_missing]
        download_url: { type: string }
        preview_url: { type: string }
        created_at: { type: string, format: date-time }
    TaskAssetGroupRevisionItem:
      type: object
      required: [id, revision_id, task_asset_id, sort_order]
      properties:
        id: { type: integer, format: int64 }
        revision_id: { type: integer, format: int64 }
        task_asset_id: { type: integer, format: int64 }
        sort_order: { type: integer }
        item_name: { type: string }
        file: { $ref: '#/components/schemas/TaskResourceFile' }
    ResourceGroupRevisionEvidence:
      type: object
      required: [schema_version, manifest_sha256, confidence, confirmed_by, confirmed_at, evidence_event_count, evidence_event_ids, evidence_event_ids_complete, upload_session_ids, upload_sessions_known]
      description: |
        Parsed fail-safe projection of versioned legacy-migration metadata. Event payloads and raw storage
        addresses are never returned. Legacy full markers expose every validated evidence id with
        `evidence_event_ids_complete=true`. Compact writer markers expose the validated total in
        `evidence_event_count` and only the stored first id; the list is incomplete when the count is greater
        than one. Clients must not treat `evidence_event_ids` as complete unless
        `evidence_event_ids_complete=true`. When `upload_sessions_known` is false, `upload_session_ids` is empty
        because the stored migration reason did not prove that association. `confidence` remains authoritative
        for distinguishing reviewed `confirmed_auto` rows from `hard_blocked` rows.
      properties:
        schema_version: { type: string, enum: [migration_v2] }
        manifest_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        confidence: { type: string, enum: [confirmed_auto, proposed_review, hard_blocked] }
        confirmed_by: { type: integer, format: int64 }
        confirmed_at: { type: string, format: date-time }
        evidence_event_ids:
          type: array
          description: Validated evidence ids stored in the marker. For compact markers this contains only the first id.
          items: { type: string }
        evidence_event_count:
          type: integer
          format: int64
          minimum: 1
          description: Total validated evidence-id count asserted by the marker.
        evidence_event_ids_complete:
          type: boolean
          description: True only when evidence_event_ids contains the complete asserted evidence set.
        upload_session_ids:
          type: array
          items: { type: string }
        upload_sessions_known: { type: boolean }
        business_reason: { type: string }
        business_reason_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lower-case SHA-256 of an oversized business reason that could not fit beside the marker.
    TaskAssetGroupRevision:
      type: object
      required: [id, group_id, revision_no, status, mode, source_stage, created_by, legacy_migration, items, references, created_at]
      properties:
        id: { type: integer, format: int64 }
        group_id: { type: integer, format: int64 }
        revision_no: { type: integer }
        status: { type: string, enum: [draft, submitted, finalized, rejected, superseded] }
        mode: { type: string, enum: [single, set] }
        source_task_asset_id: { type: integer, format: int64, nullable: true }
        source_file: { $ref: '#/components/schemas/TaskResourceFile' }
        source_stage: { type: string, enum: [design, audit, retouch, migration, reopen] }
        created_by: { type: integer, format: int64 }
        created_by_name: { type: string }
        reason: { type: string }
        legacy_migration: { type: boolean }
        evidence_summary:
          allOf: [{ $ref: '#/components/schemas/ResourceGroupRevisionEvidence' }]
          nullable: true
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskAssetGroupRevisionItem' }
        references:
          type: array
          items: { $ref: '#/components/schemas/TaskAssetGroupRevisionReference' }
        submitted_at: { type: string, format: date-time, nullable: true }
        finalized_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
