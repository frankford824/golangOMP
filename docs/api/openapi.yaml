    PrepareTaskProductCodesRequest:
      type: object
      required: [task_type]
      properties:
        task_type:
          type: string
          enum: [new_product_development]
        business_lane:
          type: string
          enum: [normal, customization]
          description: Canonical lane selector. Controls default SKU prefix (`CG` for `normal`, `DZ` for `customization`).
        category_code:
          type: string
          description: Required when `batch_items` is omitted.
        sku_code_type:
          type: string
          enum: [regular, customization]
          default: regular
          description: Automatic SKU code type. `regular` allocates `CG` codes; `customization` allocates `DZ` codes.
        count:
          type: integer
          minimum: 1
          maximum: 500
          description: Defaults to 1 when omitted. Used only when `batch_items` is omitted.
        batch_items:
          type: array
          description: If provided, backend allocates one code per item and ignores top-level `count`.
          items:
            type: object
            required: [category_code]
            properties:
              category_code:
                type: string
              sku_code_type:
                type: string
                enum: [regular, customization]
                description: Optional per-row automatic SKU code type. Defaults to `regular` when omitted.
