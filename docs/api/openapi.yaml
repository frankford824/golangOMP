  /v1/integration/external-assets/events:
    post:
      summary: Ingest NAS filesystem events
      description: |
        Dedicated machine-to-machine entry for the NAS watcher. The backend validates every path against configured NAS event roots, applies upsert/delete transitions idempotently by external origin identity and source fingerprint, queues required originals for OSS, and wakes the upload worker immediately. Duplicate `event_id` values inside one batch are ignored. Periodic full reconciliation remains the recovery path for missed filesystem events.
      tags: [IntegrationCenter]
      x-api-readiness: ready_for_frontend
      x-machine-auth:
        mode: dedicated_pre_shared_token
        header: X-External-Asset-Event-Token
      security:
        - ExternalAssetEventToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalAssetFilesystemEventBatch'
      responses:
        '200':
          description: Filesystem events accepted and applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAssetFilesystemEventResponse'
        '400':
          description: Invalid batch, event type, file metadata, mount, or origin root
        '401':
          description: Missing or invalid dedicated machine token
        '409':
          description: External asset synchronization is disabled
        '500':
          description: Event application or OSS queueing failed
