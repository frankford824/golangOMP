                description: Legacy external-file metadata only; task resources are represented by resource groups.
              external_kind:
                type: string
                nullable: true
              external_mount_path:
                type: string
                nullable: true
              external_driver:
                type: string
                nullable: true
              task_id:
                type: integer
                format: int64
                nullable: true
        products:
          type: array
