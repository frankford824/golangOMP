                  pattern: '^[0-9]{4}-[0-9]{2}$'
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Supplement import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      created:
                        type: array
                        items: *AssetWorkbenchSettlementSupplementRow
                      failures:
                        type: array
                        items:
                          type: object
                          properties:
                            row: { type: integer }
                            reason: { type: string }
        '400': { description: Invalid request }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
  /v1/asset-workbench/settlement/supplements/{supplement_id}:
    delete:
