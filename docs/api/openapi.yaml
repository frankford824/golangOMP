  /v1/asset-workbench/client-materials/batch-update:
    post:
      summary: Batch publish or update client materials
      description: Batch publishes selected system/external assets to client materials, or enables, disables, or removes existing client material publications. This synchronous endpoint is capped for selected-item operations; large folder-recursive operations should be promoted to an async task.
      tags: [AssetWorkbench, ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: bearer_authenticated
        required_roles: [AssetManager, SuperAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [publish, enable, disable, remove] }
                items:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    properties:
                      asset_id: { type: integer }
                      source_type: { type: string, enum: [external_asset, task_resource_group] }
                      source_ref: { type: string }
                      resource_id: { type: string }
                      resource_group_id: { type: integer, format: int64 }
                      finalized_revision_id: { type: integer, format: int64, description: Must equal the resource group's current finalized revision when publishing. }
                      cover_revision_item_id: { type: integer, format: int64 }
                      title: { type: string }
                      description: { type: string }
                      enabled: { type: boolean }
                      sort_order: { type: integer }
                folders:
                  type: array
                  description: Folder scopes resolved by backend. `include_children=true` recursively includes visible child folders up to the synchronous limit.
                  items:
                    type: object
                    properties:
                      path: { type: string }
                      source: { type: string, enum: [all, system, external] }
                      format_category: *AssetWorkbenchMaterialFormatCategory
                      business_lane: *AssetWorkbenchMaterialBusinessLane
                      include_children: { type: boolean }
                query: { type: string, description: Optional current search keyword scope. }
                source: { type: string, enum: [all, system, external] }
                format_category: *AssetWorkbenchMaterialFormatCategory
                business_lane: *AssetWorkbenchMaterialBusinessLane
                selection_scope: { type: string, enum: [selected, current_page, current_folder, current_folder_recursive, current_filter] }
      responses:
        '200':
          description: Batch update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      requested: { type: integer }
                      created: { type: integer }
                      updated: { type: integer }
                      enabled: { type: integer }
                      disabled: { type: integer }
                      removed: { type: integer }
                      skipped: { type: integer }
                      failed: { type: integer }
                      async_required: { type: boolean }
                      job_id: { type: string }
                      job: *AssetWorkbenchBatchJob
                      message: { type: string }
                      items:
                        type: array
                        items: *AssetWorkbenchClientMaterial
                      failures:
                        type: array
                        items:
                          type: object
                          properties:
                            index: { type: integer }
                            asset_id: { type: integer }
                            source_type: { type: string, enum: [external_asset, task_resource_group] }
                            source_ref: { type: string }
                            resource_id: { type: string }
                            reason: { type: string }
        '400': { description: Invalid request }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
