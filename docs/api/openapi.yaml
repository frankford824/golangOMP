  /v1/auth/register:
    post:
      summary: Register workflow user
      description: |
        Frontend-ready registration endpoint for the current minimal auth mainline. Registration now
        accepts explicit profile fields (`name`, `department`, optional `team`, `mobile`, optional
        `email`, `account`, `password`). Department must match the backend org
        master exposed by `/v1/org/options`. If `team` is provided it must belong to the selected department. `mobile`
        is validated and kept unique. Every new user receives only the protected explicit `member/self`
        assignment. Administrators grant all additional roles and stable-ID scopes through `/v1/access`.
        Organization display names and registration payloads never infer authorization. The response includes
        `user.frontend_access`.
      tags: [ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, name, department, mobile, password]
              properties:
                username: { type: string, description: Compatibility alias of account }
                account: { type: string }
                display_name: { type: string }
                name: { type: string }
                department:
                  $ref: '#/components/schemas/Department'
                team: { type: string }
                group: { type: string, description: Compatibility alias of team }
                mobile: { type: string }
                phone: { type: string, description: Compatibility alias of mobile }
                email: { type: string }
                password: { type: string }
      responses:
        '201':
          description: User registered and logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
        '400':
          description: Invalid registration payload, invalid department/team/mobile/email, or duplicate account/mobile
  /v1/auth/register-options:
    get:
      summary: Get registration department/team options
      description: |
        Returns the current enabled backend org-master department list plus enabled teams per department
        for frontend register-form initialization. Departments without active teams return an empty `teams` array.
      tags: [ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      responses:
        '200':
          description: Registration options
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RegistrationOptions'
  /v1/org/options:
    get:
      summary: Get organization options
      description: |
        Returns the backend org master source used by user-management, task org validation, owner-team
        compatibility bridging, and frontend org-assignment flows.
        The canonical response shape is top-level `departments[]`, where each department carries a nested `teams[]`
        array. That nested department tree is authoritative for `PATCH /v1/users/{id}` department/team updates and for
        org values accepted by task create.
        By default this endpoint returns only enabled departments and teams for assignment and validation. Authorized
        organization-master maintenance clients may pass `include_disabled=true` to return disabled departments/teams
        as well, so the frontend can display, restore, or keep maintaining rows that are no longer assignable.
        `teams_by_department` remains a deprecated compatibility mirror in v1.8 only; responses that still include it
        emit `Deprecation: version="v1.8"`.
        User responses return both `team` and compatibility alias `group` with the same value.
        Read access requires `access.view` or `access.manage`. Organization names are display values only;
        authorization is derived from explicit assignments and stable organization IDs.
        The v1.0 official baseline exposed here is exactly:
        `人事部` -> `人事管理组`;
        `运营部` -> `淘系一组`, `淘系二组`, `天猫一组`, `天猫二组`, `拼多多南京组`, `拼多多池州组`;
        `设计研发部` -> `默认组`;
        `定制美工部` -> `默认组`;
        `审核部` -> `普通审核组`, `定制审核组`;
        `云仓部` -> `默认组`;
        plus the `未分配` / `未分配池` system bucket.
        Legacy operations groups 1-7 and legacy compatibility departments are intentionally filtered out by the default `enabled=1` projection.
      tags: [ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: explicit_capability_enforced
        required_permissions: [access.view, access.manage]
      parameters:
        - in: query
          name: include_disabled
          required: false
          schema:
            type: boolean
            default: false
          description: When `true`, returns disabled departments and teams. This expanded projection requires global `access.manage`.
      responses:
        '200':
          description: Organization options
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrgOptions'
        '403':
          description: Permission denied
  /v1/org/departments:
    post:
      summary: Create organization department
      description: Creates one enabled department in backend org master. Newly created departments appear in `/v1/org/options` and become valid user/task org values immediately after creation.
      tags: [ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: explicit_capability_enforced
        required_permissions: [access.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgDepartmentRequest'
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrgDepartment'
        '400':
          description: Invalid request payload or department already exists
        '403':
          description: Permission denied
  /v1/org/departments/{id}:
    put:
      summary: Update organization department
      description: |
        Updates one backend org department. Supports renaming (`name`) and stopping use (`enabled=false`).
        When a department is stopped, the department and its child teams disappear from enabled org options,
        child teams are disabled, and existing assigned users are moved to the system `未分配/未分配池`.
        The system unassigned department cannot be deleted. Historical task snapshots are not rewritten.
      tags: [ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: explicit_capability_enforced
        required_permissions: [access.manage]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgDepartmentRequest'
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrgDepartment'
        '400':
          description: Invalid request payload, duplicate department name, or protected system department
        '403':
          description: Permission denied
        '404':
          description: Department not found
    delete:
      summary: Hard-delete organization department
      description: |
        Permanently removes one non-system department together with its child teams from backend org
        master. Existing assigned users are moved to the system `未分配/未分配池` before the org rows
        are deleted, and managed-department / managed-team scope references to the removed org are
        cleared. Historical task snapshots are not rewritten. The system `未分配` department is
        rejected with 400.
      tags: [ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: explicit_capability_enforced
        required_permissions: [access.manage]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Department deleted
        '400':
          description: Protected system department or unassigned pool unavailable
        '403':
          description: Permission denied
        '404':
          description: Department not found
  /v1/org/departments/{id}/merge:
    post:
      summary: Merge organization department into another department
      description: |
        Moves every member (and managed-department scope reference) of the source department into the
        target department, disables the source department and its teams, then returns the target
        department. Members whose team does not exist in the target department keep an empty team.
        The system `未分配` department cannot be merged; the target must be enabled.
      tags: [ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: explicit_capability_enforced
        required_permissions: [access.manage]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeOrgDepartmentRequest'
      responses:
        '200':
          description: Departments merged; returns the target department
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrgDepartment'
        '400':
          description: Missing/identical target, disabled target, or protected system department
        '403':
          description: Permission denied
        '404':
          description: Source or target department not found
  /v1/org/teams:
    post:
      summary: Create organization team
      description: Creates one enabled team in backend org master under the specified department. Newly created teams appear in `/v1/org/options` and become valid user/task org values immediately after creation.
      tags: [ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: explicit_capability_enforced
        required_permissions: [access.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgTeamRequest'
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrgTeam'
        '400':
          description: Invalid request payload, team already exists, or department is invalid
        '403':
          description: Permission denied
  /v1/org/teams/{id}:
    put:
      summary: Update organization team
      description: |
        Updates one backend org team. Supports renaming (`name`) and stopping use (`enabled=false`).
        When renaming into a name held only by a disabled, zero-member team in the same department,
        the stale disabled row is reclaimed and the active team takes that name.
        When a team is stopped, it disappears from enabled org options and existing assigned users are moved
        to the system `未分配/未分配池`. The system unassigned pool team cannot be deleted.
        Historical task snapshots are not rewritten.
      tags: [ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: explicit_capability_enforced
        required_permissions: [access.manage]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgTeamRequest'
      responses:
        '200':
          description: Team updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrgTeam'
        '400':
          description: Invalid request payload, duplicate team name under department, or protected system team
        '403':
          description: Permission denied
        '404':
          description: Team not found
    delete:
      summary: Hard-delete organization team
      description: |
        Permanently removes one non-system team from backend org master. Existing assigned users are
        moved to the system `未分配/未分配池` before the org row is deleted, and managed-team scope
        references to the removed team are cleared. Historical task snapshots are not rewritten.
        The system unassigned pool team is rejected with 400.
      tags: [ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: explicit_capability_enforced
        required_permissions: [access.manage]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Team deleted
        '400':
          description: Protected system team or unassigned pool unavailable
        '403':
          description: Permission denied
        '404':
          description: Team not found
  /v1/org/teams/{id}/merge:
    post:
      summary: Merge organization team into another team
      description: |
        Moves every member of the source team into the target team (which may belong to a different
        department), updates managed-team scope references, disables the source team, then returns the
        target team. The system unassigned pool team cannot be merged; the target team and its
        department must be enabled.
      tags: [ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: explicit_capability_enforced
        required_permissions: [access.manage]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeOrgTeamRequest'
      responses:
        '200':
          description: Teams merged; returns the target team
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrgTeam'
        '400':
          description: Missing/identical target, disabled target, or protected system team
        '403':
          description: Permission denied
        '404':
          description: Source or target team not found
  /v1/auth/login:
    post:
      summary: Login workflow user
      description: |
        Login endpoint for local session-token auth. Returns a bearer token backed by persisted
        `user_sessions` rows. This contract does not introduce SSO, org sync, or external identity
        providers. The response includes `session_id` plus the current frontend permission contract
        under `user.frontend_access`.
      tags: [ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: Workflow user login name. Runtime handler binds this as the primary field.
                account:
                  type: string
                  description: Compatibility alias of `username`.
                password:
                  type: string
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
        '401':
          description: Invalid account or password
  /v1/auth/me:
    get:
      summary: Get current authenticated user
      description: |
        Returns the current bearer-session user. Debug headers are not accepted as a substitute for
        login on this route. `data.frontend_access` is the explicit frontend-ready contract for page,
        menu, action, scope, role, department, and team gating.
      tags: [ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: session_token_role_enforced
        session_required: true
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WorkflowUser'
        '401':
          description: Authentication required
  /v1/auth/password:
    put:
      summary: Change current user password
      description: |
        Session-backed current-user password change endpoint. Requires `old_password` verification and
        validates `new_password` with the same minimum password rules used during registration.
      tags: [ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: session_token_role_enforced
      requestBody:
        required: true
        content:
          application/json:
