    delete:
      summary: Delete asset
      description: >-
        Discards one staged, unbound resource and its backend-derived preview/design-thumb resources; reason is
        required. Authorization is the explicit `asset.manage` capability intersected with the task's stable
        organization-ID scope. The same transaction locks the complete resource set, rejects any resource referenced
        by a working/finalized/historical resource-group revision or client publication, immediately revokes access,
        soft-deletes metadata, and writes durable adapter-aware object-deletion outbox rows. Physical deletion is
        asynchronous: only `oss_upload_service` rows reach OSS; placeholder/mock/export-placeholder rows complete
        without a physical call; unknown adapters fail closed, alert, and retry indefinitely. Object-not-found is
        success. Completed and Archived tasks require reopen;
        reopening never permits deletion of files retained by an earlier finalized revision.
      tags: [Assets, ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-owner-round: R4-SA-A
      x-permissions: [asset.manage]
      x-rbac-placeholder:
        auth_mode: session_token_capability_enforced
      parameters:
        - in: path
          name: asset_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetReasonRequest'
      responses:
        '204': { description: Resource access revoked, metadata soft-deleted, and object deletion queued }
        '403':
          description: Missing `asset.manage` capability or outside the task's stable organization-ID scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Task requires reopen, or the resource is bound, finalized, historical, or publication-pinned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
