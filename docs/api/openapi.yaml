              owner_department:
                type: string
                nullable: true
              owner_team:
                type: string
                nullable: true
              owner_org_team:
                type: string
                nullable: true
              creator_id:
                type: integer
                format: int64
                nullable: true
              creator_name:
                type: string
                nullable: true
              designer_id:
                type: integer
                format: int64
                nullable: true
              designer_name:
                type: string
                nullable: true
              created_at:
                type: string
                format: date-time
                nullable: true
              deadline_at:
                type: string
                format: date-time
                nullable: true
              highlight:
                type: string
                nullable: true
                description: Matched snippet (optional in v1 MySQL LIKE mode).
        assets:
          type: array
          items:
            type: object
            required: [asset_id, file_name, source_type]
            properties:
              asset_id:
                type: integer
                format: int64
              resource_id:
                type: string
                nullable: true
                description: Unified resource id. External resources use `ext-{id}`.
              file_name:
                type: string
              source_type:
                type: string
                enum: [task_resource_group, external_asset, external]
              resource_group_id:
                type: integer
                format: int64
                nullable: true
                description: Numeric resource-group id for `task_resource_group` results.
              finalized_revision_id:
                type: integer
                format: int64
                nullable: true
                description: Finalized revision pinned by this search result.
              task_no:
                type: string
                nullable: true
              sku_code:
                type: string
                nullable: true
              mode:
                type: string
                enum: [single, set]
                nullable: true
              final_item_count:
                type: integer
                minimum: 0
                nullable: true
              source_label:
                type: string
                nullable: true
              source_module_key:
                type: string
                nullable: true
