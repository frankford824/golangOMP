      description: Deletes by marking the supplement as `voided`; in-batch and settled supplement rows are protected.
      tags: [AssetWorkbench, ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: bearer_authenticated
