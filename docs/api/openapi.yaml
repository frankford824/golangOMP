        content:
          application/json:
            schema:
              type: object
              required: [audience, title, content]
              properties:
                audience:
                  type: string
                  enum: [all, users]
                user_ids:
                  type: array
                  maxItems: 200
                  items:
                    type: integer
                    format: int64
                  description: Required when `audience = users`.
                title:
                  type: string
                  maxLength: 80
                content:
                  type: string
                  maxLength: 1000
