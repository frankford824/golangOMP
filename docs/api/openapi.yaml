                            path: { type: string }
                            name: { type: string }
                            source_type: { type: string, enum: [system, external] }
                            file_count: { type: integer }
                            direct_file_count: { type: integer }
                      files:
                        type: array
                        items: *AssetWorkbenchSystemAssetRow
                      total: { type: integer }
                      page: { type: integer }
                      size: { type: integer }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
  /v1/asset-workbench/settlement/supplement-permissions:
    get:
      summary: List asset workbench supplement permissions
      description: Lists per-person supplement switches. An enabled permission is scoped to the current Asia/Shanghai natural month and can be closed at any time.
      tags: [AssetWorkbench, ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: bearer_authenticated
        required_roles: [AssetSettlement, SuperAdmin]
      parameters:
        - in: query
          name: payee_user_id
          schema: { type: integer }
        - in: query
          name: business_month
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        - in: query
          name: enabled
          schema: { type: boolean }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Supplement permission rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: &AssetWorkbenchSupplementPermissionRow
                      type: object
                      properties:
                        id: { type: integer }
                        submission_item_id: { type: integer, nullable: true, description: Linked supplement upload item; null for administrator-created manual rows. }
                        payee_user_id: { type: integer }
                        business_month: { type: string }
                        enabled: { type: boolean }
                        reason: { type: string }
                        granted_by: { type: integer }
                        revoked_by: { type: integer, nullable: true }
                        granted_at: { type: string, format: date-time }
                        revoked_at: { type: string, format: date-time, nullable: true }
                        updated_at: { type: string, format: date-time }
                  pagination:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      page_size: { type: integer }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
    put:
      summary: Open or close supplement permission for one person
      description: Opens supplement entry only for the current Asia/Shanghai natural month, or closes an existing month permission. The target supplement date does not control the payroll month.
      tags: [AssetWorkbench, ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: bearer_authenticated
        required_roles: [AssetSettlement, SuperAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payee_user_id, business_month, enabled]
              properties:
                payee_user_id: { type: integer }
                business_month: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
                enabled: { type: boolean }
                reason: { type: string }
      responses:
        '200':
          description: Saved supplement permission
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: *AssetWorkbenchSupplementPermissionRow
        '400': { description: Invalid or non-current month }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
  /v1/asset-workbench/settlement/supplement-eligible-months:
    get:
      summary: Get the natural month currently eligible for supplement entry
      description: Returns the current Asia/Shanghai natural month for the selected person. Historical target dates are allowed, but their month never replaces the returned payroll month.
