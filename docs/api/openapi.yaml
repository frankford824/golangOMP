                nullable: true
              category:
                type: string
                nullable: true
        users:
          type: array
          description: |
            Always `[]` unless caller role ∈ {super_admin, hr_admin} (IA §4.3; R1.7-D U1).
          items:
            type: object
            required: [user_id, username]
            properties:
