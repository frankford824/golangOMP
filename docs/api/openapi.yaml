      type: object
      properties:
        codes:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              category_code:
                type: string
              sku_code:
                type: string
                description: "Auto-generated default task product code. Format depends on `sku_code_type`: `regular` uses `CG` + one uppercase category letter + 6-digit sequence; `customization` uses `DZ` + one uppercase category letter + 6-digit sequence."
    AssignTaskRequest:
      type: object
      description: |
        `assigned_by` is optional. When omitted, the backend uses the current authenticated actor.
      properties:
        designer_id:
          type: integer
          nullable: true
          description: |
            Designer or customization-operator user id (same field for both lanes).
            Regular tasks expect an active `Designer` target; customization tasks in
            `PendingCustomizationProduction` expect an active `CustomizationOperator` target.
            Omit or send null on a single-task reassign to clear the assignee and return an InProgress task to PendingAssign.
        assigned_by:
          type: integer
          description: Optional override for compatibility. Defaults to the current authenticated actor.
        remark: { type: string }
    UpdateTaskBusinessInfoRequest:
      type: object
      description: |
        `operator_id` is optional. When omitted, the backend uses the current authenticated actor.
        `catalog.manage` may update ordinary and governed fields within its stable data scope.
        `task.create` may update ordinary business fields only when the current actor created the
        task and the task is not completed, archived, or cancelled. Task creators cannot submit
        manual-cost, cost-rule, `trigger_filing`, or `filed_at` controls.
        Existing-product rebinding may pass `product_selection.erp_product` so the backend can
        cache or bind the chosen ERP Bridge product while preserving external id, sku, image,
        and price snapshot data under task-side `product_selection`.
        Filing follows backend trigger policy. `filed_at` and `trigger_filing` remain accepted
        as compatibility inputs and map to a forced filing trigger source.
        For original-product filing, `product_selection.erp_product` is the canonical source snapshot.
      properties:
        operator_id:
          type: integer
          description: Optional override for compatibility. Defaults to the current authenticated actor.
        product_name:
          type: string
          description: Clean product-name edit field. For new-product tasks this updates `tasks.product_name_snapshot` and is included in the next ERP filing payload.
        product_name_snapshot:
          type: string
          description: Compatibility alias for `product_name`.
        i_id:
          type: string
          description: Canonical Jushuitan product style/family i_id used by ERP filing. Prefer this over legacy category fields.
        product_i_id:
          type: string
          description: Compatibility alias for `i_id`.
        category: { type: string }
        category_id:
          type: integer
          nullable: true
        category_code: { type: string }
        spec_text: { type: string }
        material: { type: string }
        size_text: { type: string }
        design_requirement:
          type: string
          description: Editable demand text. For `original_product_development`, this is accepted as a compatibility alias and persisted to `change_request`; for `new_product_development` and `retouch_task`, it persists to `design_requirement`.
        change_request:
          type: string
          description: Editable original-product change request. For `new_product_development` and `retouch_task`, this is accepted as a compatibility alias of `design_requirement`.
        note:
          type: string
          description: Editable operation note. An explicit empty string clears the existing note.
        operation_note:
          type: string
          description: Compatibility alias for `note`.
        craft_text: { type: string }
        width:
          type: number
          format: double
          nullable: true
        height:
          type: number
          format: double
          nullable: true
        area:
          type: number
          format: double
          nullable: true
        quantity:
          type: integer
          format: int64
          nullable: true
        process: { type: string }
        product_selection:
          allOf: [{ $ref: '#/components/schemas/TaskProductSelectionContext' }]
          nullable: true
        cost_price:
          type: number
          format: double
          nullable: true
          description: Optional current effective cost. If `manual_cost_override=true`, this becomes the manual override value; otherwise the backend prefers system prefill when available.
        cost_rule_id:
          type: integer
          nullable: true
        cost_rule_name: { type: string }
        cost_rule_source: { type: string }
        manual_cost_override:
          type: boolean
          description: Business data flag only. It distinguishes user-entered override from system prefill and is not tied to auth/permissions.
        manual_cost_override_reason: { type: string }
        trigger_filing:
          type: boolean
          description: Legacy compatibility switch. Prefer backend auto-policy; this flag forces one filing evaluation.
        filed_at:
          type: string
          format: date-time
          nullable: true
          description: Legacy compatibility trigger timestamp. Backend maps this to a forced filing evaluation source.
        priority:
          type: string
          enum: [low, normal, high, critical]
          description: Task priority. When provided, updates `tasks.priority` without requiring other business-info fields.
        remark: { type: string }
