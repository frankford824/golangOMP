                  type: string
                  pattern: '^[0-9]{4}-[0-9]{2}$'
                  description: Business month displayed to the client when the upload page was rendered. If it differs from server current month, backend returns MONTH_ROLLOVER_REQUIRED unless acknowledged.
                month_rollover_ack:
                  type: boolean
