        expected_size: { type: integer, format: int64, minimum: 1 }
        mime_type: { type: string }
        file_hash: { type: string }
        remark: { type: string }
    PlanningSKUImageUploadSessionResult:
      type: object
      required: [session]
      properties:
        session: { $ref: '#/components/schemas/UploadSession' }
        remote: { $ref: '#/components/schemas/RemoteUploadSessionPlan' }
        oss_direct: { $ref: '#/components/schemas/OSSDirectUploadPlan' }
        complete_endpoint: { type: string }
        cancel_endpoint: { type: string }
paths:
  /v1/access/permissions:
    get:
      operationId: listAccessPermissions
      tags: [AccessPolicy]
      summary: List the code-maintained capability catalog
      x-api-readiness: ready_for_frontend
      responses:
        '200':
          description: Capability catalog.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AccessPermission' } }
        '403': { $ref: '#/components/responses/V8Forbidden' }
  /v1/access/roles:
    get:
      operationId: listAccessRoles
      tags: [AccessPolicy]
      summary: List administrator-managed business roles
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: include_archived, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Roles and their capability sets.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AccessRole' } }
        '403': { $ref: '#/components/responses/V8Forbidden' }
    post:
      operationId: createAccessRole
      tags: [AccessPolicy]
      summary: Create a business role
      x-api-readiness: ready_for_frontend
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessRoleCreateRequest' }
      responses:
        '201':
          description: Role created and policy revision advanced.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AccessPolicyMutationResult' }
        '400': { $ref: '#/components/responses/V8BadRequest' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
        '409': { $ref: '#/components/responses/V8Conflict' }
  /v1/access/roles/{id}:
    patch:
      operationId: updateAccessRole
      tags: [AccessPolicy]
      summary: Update role display metadata
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessRoleUpdateRequest' }
      responses:
        '200':
          description: Updated role and new policy revision.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AccessPolicyMutationResult' }
        '400': { $ref: '#/components/responses/V8BadRequest' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
        '404': { $ref: '#/components/responses/V8NotFound' }
        '409': { $ref: '#/components/responses/V8Conflict' }
  /v1/access/roles/{id}/archive:
    post:
      operationId: archiveAccessRole
      tags: [AccessPolicy]
      summary: Archive an in-use role without physical deletion
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessRoleArchiveRequest' }
      responses:
        '200':
          description: Archived role and new policy revision.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AccessPolicyMutationResult' }
        '400': { $ref: '#/components/responses/V8BadRequest' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
        '409': { $ref: '#/components/responses/V8Conflict' }
  /v1/access/roles/{id}/permissions:
    put:
      operationId: replaceAccessRolePermissions
      tags: [AccessPolicy]
      summary: Atomically replace a role's capability set
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceRolePermissionsRequest' }
      responses:
        '200':
          description: Updated role and new policy revision.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AccessPolicyMutationResult' }
        '400': { $ref: '#/components/responses/V8BadRequest' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
        '409': { $ref: '#/components/responses/V8Conflict' }
  /v1/access/users:
    get:
      operationId: listAccessPolicyUsers
      tags: [AccessPolicy]
      summary: Search the minimal personnel selector for explicit assignments
      description: Returns only stable user and organization identifiers plus display labels. The route is governed by `access_policy.view` or `access_policy.manage` and never by legacy administrator roles.
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Matches username or display name. }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: Minimal personnel options.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AccessPolicyUserOption' } }
                  pagination: { $ref: '#/components/schemas/PaginationMeta' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
  /v1/access/users/{id}/assignments:
    put:
      operationId: replaceUserAccessAssignments
      tags: [AccessPolicy]
      summary: Atomically replace a user's roles and stable organization-ID scopes
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceAccessAssignmentsRequest' }
      responses:
        '200':
          description: Effective access after replacement.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AccessPolicyMutationResult' }
        '400': { $ref: '#/components/responses/V8BadRequest' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
        '409': { $ref: '#/components/responses/V8Conflict' }
  /v1/access/users/{id}/effective:
    get:
      operationId: getUserEffectiveAccess
      tags: [AccessPolicy]
      summary: Resolve capabilities, scopes, sources and policy revision
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Effective access projection.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/EffectiveAccess' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
        '404': { $ref: '#/components/responses/V8NotFound' }
  /v1/access/org-policies/{subject_type}/{subject_id}:
    parameters:
      - { name: subject_type, in: path, required: true, schema: { type: string, enum: [department, team] } }
      - { name: subject_id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getAccessOrgPolicies
      tags: [AccessPolicy]
      summary: Read explicitly enabled defaults for an organization ID
      x-api-readiness: ready_for_frontend
      responses:
        '200':
          description: Organization policies.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AccessOrgPolicy' } }
        '403': { $ref: '#/components/responses/V8Forbidden' }
    put:
      operationId: replaceAccessOrgPolicies
      tags: [AccessPolicy]
      summary: Atomically replace policies for an organization ID
      x-api-readiness: ready_for_frontend
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceOrgPoliciesRequest' }
      responses:
        '200':
          description: Policies and new policy revision.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AccessPolicyMutationResult' }
        '400': { $ref: '#/components/responses/V8BadRequest' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
        '409': { $ref: '#/components/responses/V8Conflict' }
  /v1/access/preview:
    post:
      operationId: previewUserEffectiveAccess
      tags: [AccessPolicy]
      summary: Preview the current effective-access projection for a user
      x-api-readiness: ready_for_frontend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer, format: int64 }
      responses:
        '200':
          description: Effective access projection.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/EffectiveAccess' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
  /v1/access/events:
    get:
      operationId: listAccessPolicyEvents
      tags: [AccessPolicy]
      summary: List access-policy audit events
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Policy audit events.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AccessPolicyEvent' } }
        '403': { $ref: '#/components/responses/V8Forbidden' }
  /v1/tasks/{id}/submit-design:
    post:
      operationId: submitTaskDesignV8
      tags: [TaskResourceWorkflow]
      summary: Submit designer-selected mode and source files for unified audit
      description: |
        Ordinary/customization design tasks submit one source per group plus the designer's single/set
        decision; final outputs are rejected at this stage. Retouch tasks submit final outputs here and
        complete directly. Upload-session completion never advances workflow state.
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitDesignV2Request' }
      responses:
        '200':
          description: Submitted task resource bundle.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ResourceBundle' }
        '400': { $ref: '#/components/responses/V8BadRequest' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
        '409': { $ref: '#/components/responses/V8Conflict' }
  /v1/tasks/{id}/audit/decision:
    post:
      operationId: decideTaskAuditV8
      tags: [TaskResourceWorkflow]
      summary: Approve and finalize, or return the task to design
      description: |
        Approval uploads a complete final set for every resource group using the designer-selected mode.
        The auditor may replace the source file; otherwise the designer source remains effective. Approval
        finalizes resources and returns only after the task is `Completed`. Return requires a reason and
        restores the design stage without accepting a partial final set.
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditDecisionV2Request' }
      responses:
        '200':
          description: Task resource bundle after the decision; approve is already Completed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ResourceBundle' }
        '400': { $ref: '#/components/responses/V8BadRequest' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
        '409': { $ref: '#/components/responses/V8Conflict' }
  /v1/tasks/audit/handover-candidates:
    get:
      operationId: listTaskAuditHandoverCandidatesV8
      tags: [TaskResourceWorkflow]
      summary: List PendingAudit tasks currently handled by the caller and eligible for handover
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [PendingAudit] } }
        - { name: owner_org_team, in: query, description: Display filter only; authorization uses stable organization IDs., schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Scoped handover candidates.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuditHandoverCandidateListResponse' }
        '400': { $ref: '#/components/responses/V8BadRequest' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
  /v1/tasks/audit/handover-batch:
    post:
      operationId: batchTaskAuditHandoverV8
      tags: [TaskResourceWorkflow]
      summary: Hand over caller-owned PendingAudit tasks to an eligible auditor
      x-api-readiness: ready_for_frontend
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchAuditHandoverRequest' }
      responses:
        '200':
          description: Per-task batch result.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BatchAuditHandoverResponse' }
        '400': { $ref: '#/components/responses/V8BadRequest' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
        '409': { $ref: '#/components/responses/V8Conflict' }
  /v1/tasks/{id}/audit/handover:
    post:
      operationId: handoverTaskAuditV8
      tags: [TaskResourceWorkflow]
      summary: Hand over a PendingAudit task currently handled by the caller
      description: The task row is locked and its current handler and workflow revision are revalidated before any handover record or event is written.
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditHandoverCreateRequest' }
      responses:
        '201':
          description: Pending handover created and current handler cleared.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuditHandover' }
        '400': { $ref: '#/components/responses/V8BadRequest' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
        '409': { $ref: '#/components/responses/V8Conflict' }
  /v1/tasks/{id}/audit/handovers:
    get:
      operationId: listTaskAuditHandoversV8
      tags: [TaskResourceWorkflow]
      summary: List audit handovers visible in the caller's task scope
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Audit handovers for the task.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditHandover' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
        '404': { $ref: '#/components/responses/V8NotFound' }
  /v1/tasks/{id}/audit/takeover:
    post:
      operationId: takeoverTaskAuditV8
      tags: [TaskResourceWorkflow]
      summary: Accept a PendingAudit handover assigned to the caller
      description: The task and handover rows are locked and revalidated before the handler, audit record, and event are written.
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditTakeoverRequest' }
      responses:
        '200':
          description: Handover taken over exactly once.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [task_id, handover_id, action]
                    properties:
                      task_id: { type: integer, format: int64 }
                      handover_id: { type: integer, format: int64 }
                      action: { type: string, enum: [taken_over] }
        '400': { $ref: '#/components/responses/V8BadRequest' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
        '409': { $ref: '#/components/responses/V8Conflict' }
  /v1/tasks/{id}/reopen:
    post:
      operationId: reopenTaskV8
      tags: [TaskResourceWorkflow]
      summary: Reopen a completed design or retouch task under optimistic concurrency
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReopenTaskV2Request' }
      responses:
        '200':
          description: Reopened resource bundle.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ResourceBundle' }
        '400': { $ref: '#/components/responses/V8BadRequest' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
        '409': { $ref: '#/components/responses/V8Conflict' }
  /v1/tasks/{id}/resource-bundle:
    get:
      operationId: getTaskResourceBundle
      tags: [TaskResourceWorkflow]
      summary: Read task, SKU and retouch resource groups
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Resource bundle.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ResourceBundle' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
        '404': { $ref: '#/components/responses/V8NotFound' }
        '409': { $ref: '#/components/responses/V8Conflict' }
  /v1/resource-groups:
    get:
      operationId: listTaskResourceGroups
      tags: [TaskResourceWorkflow]
      summary: Search the current working and finalized resource-group read model
      description: |
        Default response uses `view_mode=group` (one SKU resource-group card).
        When `resource_role` or a non-all `format_category` is supplied, the service returns `view_mode=flat` with matching `flat_items`.
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: task_id, in: query, schema: { type: integer, format: int64 } }
        - { name: sku_code, in: query, schema: { type: string } }
        - { name: task_no, in: query, schema: { type: string } }
        - { name: creator_id, in: query, schema: { type: integer, format: int64 } }
        - { name: resource_role, in: query, schema: { type: string, enum: [reference, source, final] } }
        - { name: q, in: query, description: Searches task number, SKU, indexed resource text, and finalized filenames., schema: { type: string } }
        - { name: format_category, in: query, schema: { type: string, enum: [all, image, design, pdf, document, video, archive], default: all }, description: document is accepted as an alias of pdf. }
        - { name: business_lane, in: query, schema: { type: string, enum: [normal, customization] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Scoped resource groups.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ResourceGroupListResult' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
        '409': { $ref: '#/components/responses/V8Conflict' }
  /v1/resource-groups/{id}:
    get:
      operationId: getTaskResourceGroup
      tags: [TaskResourceWorkflow]
      summary: Read one resource group and its current revisions
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Resource group.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TaskAssetGroup' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
        '404': { $ref: '#/components/responses/V8NotFound' }
        '409': { $ref: '#/components/responses/V8Conflict' }
  /v1/resource-groups/{id}/revisions:
    get:
      operationId: listTaskResourceGroupRevisions
      tags: [TaskResourceWorkflow]
      summary: List every historical revision of one resource group
      description: |
        Returns all revision states newest first (`revision_no DESC`, then `id DESC`) within the
        caller's effective `asset.view` scope, matching the resource-group detail contract. Responses use
        controlled task-asset preview URLs, and download URLs are present only when the caller also
        has scoped `asset.download`. Both capabilities use controlled `/v1/task-assets/{task_asset_id}/preview|download`
        access-service paths; this endpoint never returns raw object-storage addresses or signed URLs.
        Reference URLs are omitted unless the snapshot has a formal task-asset id. A reference whose
        snapshot storage ref or formal task-asset storage ref is `historical_unavailable` keeps immutable
        metadata but omits both URLs.
        The working/finalized revision ids are returned from the authoritative resource-group pointers.
      x-api-readiness: ready_for_frontend
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Scoped historical resource-group revisions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ResourceGroupRevisionListResult' }
        '400': { $ref: '#/components/responses/V8BadRequest' }
        '403': { $ref: '#/components/responses/V8Forbidden' }
        '404': { $ref: '#/components/responses/V8NotFound' }
        '409': { $ref: '#/components/responses/V8Conflict' }
  /v1/resource-groups/batch-download:
    post:
      operationId: batchDownloadTaskResourceGroups
      tags: [TaskResourceWorkflow]
      summary: Expand finalized revision items into an ordered download manifest
      description: Requires asset.download and applies the actor's effective task data scope. This is the default single/set resource download contract, not an export operation.
      x-api-readiness: ready_for_frontend
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceGroupBatchDownloadRequest' }
      responses:
        '200':
          description: Ordered all-or-nothing manifest.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
