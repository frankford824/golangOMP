openapi: 3.0.3
info:
  title: Yongbo Workflow V8 API
  version: 8.0.0
  description: |
    Current V8 shared-backend contract for main-ops and asset-workbench.
    Read this OpenAPI together with:
    - `docs/V1_BACKEND_SOURCE_OF_TRUTH.md` for route classification and governance
    - `transport/http.go` for the mounted runtime
    V8 task workflow is create -> design -> audit -> completed. Retouch and SKU planning
    finalize directly. Authorization uses explicit capability assignments and stable organization IDs;
    organization names are display-only. Business resources are resolved exclusively through resource
    groups. Retired workflow families and independent compatibility routes are not part of this
    contract and are not exposed through aliases.
servers:
  - url: /
tags:
  - name: AIChat
    description: Native read-only data assistant with owner-scoped conversations, traceable evidence and streaming responses.
  - name: AccessPolicy
    description: Explicit administrator-managed roles, capabilities and stable organization-ID scopes.
  - name: TaskResourceWorkflow
    description: V8 design submission, unified audit, reopen and finalized resource-group contract.
  - name: PlanningSKU
    description: Single or batch SKU planning creation, correction, Excel and optional asynchronous ERP synchronization.
  - name: ReadyForFrontend
    description: Current V8 endpoints ready for frontend integration.
  - name: ERPBridge
    description: Frontend-ready MAIN facade over the Bridge-owned ERP/JST adapter query surface. Keyword search is the primary original-product picker entry; bridge categories are auxiliary only and must not block selection when incomplete. Same-host deployment should point `ERP_BRIDGE_BASE_URL` at loopback unless a different local ingress is intentional. Bridge owns adapter query semantics and ERP mutation execution. Raw ERP mutation APIs are not exposed here as general MAIN routes.
  - name: CategoryCenter
    description: Current category configuration and ERP search-entry semantics through `search_entry_code` and `is_search_entry`.
  - name: CategoryMappings
    description: Current category-to-ERP positioning contract for first-level search-entry mappings and reserved secondary/tertiary search conditions.
  - name: CostRules
    description: Current cost-rule maintenance, lineage, version, effective-window and calculation-preview contract.
  - name: AssetWorkbench
    description: Independent assets.yongbo.cloud workbench APIs for piecework submission, template assignment, member lookup, and settlement support.
  - name: IntegrationCenter
    description: Operational machine-to-machine integration boundary for external-asset ingestion and the narrow ERP Bridge filing trace used by task business information.
components:
  securitySchemes:
    ExternalAssetEventToken:
      type: apiKey
      in: header
      name: X-External-Asset-Event-Token
      description: Dedicated pre-shared machine credential for the NAS filesystem event watcher. It does not grant access to session or legacy agent APIs.
  responses:
    V8BadRequest:
      description: Invalid request or business validation failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    V8Forbidden:
      description: Effective capability or data scope does not allow this action.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    V8NotFound:
      description: Resource not found in the caller's visible scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    V8Conflict:
      description: Expected policy, workflow, group or entity revision does not match current state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    IdentityRoleCode:
      type: string
      description: Read-only identity label returned for account display. It never grants V8 capabilities; authorization is managed only through `/v1/access/*` assignments and stable organization-ID scopes.
    AssetWorkbenchProfile:
      type: object
      required: [id, user_id, worker_type, job_grade, real_name, province, city, gender, alipay_account, grade_hidden, status, pii_completed, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        worker_type: { type: string, enum: [fulltime, parttime] }
        job_grade: { type: string }
        real_name: { type: string }
        phone:
          type: string
          nullable: true
          description: Full value for self/detail responses; masked in the profile list response.
        province: { type: string }
        city: { type: string }
        id_card:
          type: string
          nullable: true
          description: Full value for self/detail responses; masked in the profile list response.
        gender: { type: string, enum: ['', female, male] }
        alipay_account:
          type: string
          description: Full value for self/detail responses; masked in the profile list response.
        onboarded_at: { type: string, format: date-time, nullable: true }
        grade_hidden: { type: boolean }
        status: { type: string, enum: [pending, active, suspended] }
        pii_completed: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssetWorkbenchProfileUpdate:
      type: object
      properties:
        worker_type: { type: string, enum: [fulltime, parttime] }
        job_grade: { type: string }
        real_name: { type: string }
        phone: { type: string }
        province: { type: string }
        city: { type: string }
        id_card: { type: string, minLength: 18, maxLength: 18, pattern: '^[0-9]{18}$' }
        gender: { type: string, enum: ['', female, male] }
        alipay_account: { type: string }
        onboarded_at: { type: string, format: date-time }
        grade_hidden: { type: boolean }
        status: { type: string, enum: [pending, active, suspended] }
        reason: { type: string }
    AssetWorkbenchSelfProfileUpdate:
      type: object
      required: [real_name, phone, province, city, id_card, gender, alipay_account]
      properties:
        worker_type: { type: string, enum: [fulltime, parttime] }
        real_name: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        province: { type: string, minLength: 1 }
        city: { type: string, minLength: 1 }
        id_card: { type: string, minLength: 18, maxLength: 18, pattern: '^[0-9]{18}$' }
        gender: { type: string, enum: [female, male] }
        alipay_account: { type: string, minLength: 1 }
        reason: { type: string }
    AssetWorkbenchRegisterRequest:
      type: object
      required: [account, name, phone, password, worker_type, province, city, id_card, gender, alipay_account]
      properties:
        account: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password: { type: string, minLength: 1, format: password }
        worker_type: { type: string, enum: [fulltime, parttime] }
        province: { type: string, minLength: 1 }
        city: { type: string, minLength: 1 }
        id_card: { type: string, minLength: 18, maxLength: 18, pattern: '^[0-9]{18}$' }
        gender: { type: string, enum: [female, male] }
        alipay_account: { type: string, minLength: 1 }
    AssetWorkbenchRegisterResponse:
      type: object
      required: [auth, profile]
      properties:
        auth:
          type: object
          additionalProperties: true
        profile:
          $ref: '#/components/schemas/AssetWorkbenchProfile'
    Department:
      type: string
      description: Display name from the organization master. Authorization and data scope use stable department/team IDs only; names are never permission conditions.
    PlaceholderAuthMode:
      type: string
      enum: [debug_header_role_enforced, session_token_role_enforced]
    BatchTaskActionResult:
      type: object
      properties:
        batch_request_id: { type: string }
        total: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        items:
          type: array
          items: { type: object, additionalProperties: true }
    UserStatus:
      type: string
      enum: [active, disabled]
    EmploymentType:
      type: string
      enum: [full_time, part_time]
    WorkflowUser:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        account: { type: string }
        employee_no:
          type: integer
          minimum: 0
          maximum: 9999
          nullable: true
          description: 管理员维护的员工工号；纯数字，范围 0-9999，全局唯一。历史用户可能为空。
        display_name: { type: string }
        name: { type: string }
        real_name: { type: string }
        department:
          $ref: '#/components/schemas/Department'
        department_id:
          type: integer
          format: int64
          nullable: true
          description: Stable department ID used by authorization; department name is display-only.
        team: { type: string }
        team_id:
          type: integer
          format: int64
          nullable: true
          description: Stable team ID used by authorization; team name is display-only.
        group: { type: string, description: Compatibility alias of team }
        mobile: { type: string }
        phone: { type: string }
        email: { type: string, nullable: true }
        avatar: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        managed_departments:
          type: array
          items:
            type: string
        managed_teams:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        employment_type:
          $ref: '#/components/schemas/EmploymentType'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/IdentityRoleCode'
        last_login_at:
          type: string
          format: date-time
          nullable: true
        jst_u_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        frontend_access:
          $ref: '#/components/schemas/FrontendAccess'
    CreateManagedUserRequest:
      type: object
      required: [username, employee_no, display_name, department, team, mobile, password]
      properties:
        username:
          type: string
        employee_no:
          type: integer
          minimum: 0
          maximum: 9999
          description: 管理员维护的员工工号；纯数字，范围 0-9999，全局唯一。重复时服务端返回中文业务提示。
        display_name:
          type: string
        department:
          type: string
          description: Must match one enabled department from backend org master exposed by `/v1/org/options`.
        team:
          type: string
          description: Must match one enabled team under the selected department in backend org master exposed by `/v1/org/options`.
        mobile:
          type: string
        email:
          type: string
          nullable: true
        password:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        employment_type:
          $ref: '#/components/schemas/EmploymentType'
    ResetUserPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
    FrontendAccess:
      type: object
      properties:
        is_super_admin:
          type: boolean
        is_department_admin:
          type: boolean
        department:
          type: string
        team:
          type: string
        roles:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        menus:
          type: array
          items:
            type: string
        pages:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            type: string
        modules:
          type: array
          items:
            type: string
        managed_departments:
          type: array
          items:
            type: string
        permission_flags:
          type: array
          items:
            type: string
        page_keys:
          type: array
          items:
            type: string
        menu_keys:
          type: array
          items:
            type: string
        module_keys:
          type: array
          items:
            type: string
        access_scopes:
          type: array
          items:
            type: string
    DepartmentOption:
      type: object
      required: [name, enabled, member_count]
      properties:
        id:
          type: integer
          format: int64
        name:
          $ref: '#/components/schemas/Department'
        teams:
          type: array
          items:
            type: string
        team_items:
          type: array
          items:
            $ref: '#/components/schemas/OrgTeamOption'
        enabled:
          type: boolean
          description: Always emitted, including `false` for disabled org-master rows when `include_disabled=true`.
        member_count:
          type: integer
          description: Number of users currently assigned to this department (any team, active or disabled accounts). Always emitted so zero-member legacy departments are visible to org-maintenance clients.
    OrgTeamOption:
      type: object
      required: [name, enabled, member_count]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        enabled:
          type: boolean
          description: Always emitted, including `false` for disabled org-master rows when `include_disabled=true`.
        member_count:
          type: integer
          description: Number of users currently assigned to this team (active or disabled accounts).
    OrgDepartment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrgTeam:
      type: object
      properties:
        id:
          type: integer
          format: int64
        department_id:
          type: integer
          format: int64
        department:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateOrgDepartmentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Unique department name in backend org master.
    UpdateOrgDepartmentRequest:
      type: object
      properties:
        name:
          type: string
          description: Rename the department. Must be unique among org departments. Cannot be combined with stopping use of the same department.
        enabled:
          type: boolean
          description: Set to false to stop using the department. Existing assigned users are moved to the system unassigned pool, and child teams are disabled. System unassigned department cannot be deleted.
    CreateOrgTeamRequest:
      type: object
      required: [name]
      anyOf:
        - required: [department_id]
        - required: [department]
      properties:
        department_id:
          type: integer
          format: int64
          description: Backend org department id. Optional when `department` is provided.
        department:
          type: string
          description: Backend org department name. Optional when `department_id` is provided.
        name:
          type: string
          description: Unique team name under the selected department in backend org master.
    UpdateOrgTeamRequest:
      type: object
      properties:
        name:
          type: string
          description: Rename the team inside its department. Cannot be combined with deleting the same team.
        enabled:
          type: boolean
          description: Set to false to stop using the team. Existing assigned users are moved to the system unassigned pool. System unassigned pool team cannot be deleted.
    MergeOrgDepartmentRequest:
      type: object
      required: [target_department_id]
      properties:
        target_department_id:
          type: integer
          format: int64
          description: Enabled department that receives every member and managed-department scope of the source department. Must differ from the source department.
    MergeOrgTeamRequest:
      type: object
      required: [target_team_id]
      properties:
        target_team_id:
          type: integer
          format: int64
          description: Enabled team (under an enabled department) that receives every member of the source team. Must differ from the source team.
    RegistrationOptions:
      type: object
      properties:
        departments:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentOption'
    ConfiguredUserAssignment:
      type: object
      properties:
        username:
          type: string
          nullable: true
        display_name:
          type: string
          nullable: true
        department:
          $ref: '#/components/schemas/Department'
        team:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/IdentityRoleCode'
        managed_departments:
          type: array
          items:
            type: string
        managed_teams:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/UserStatus'
    OrgOptions:
      type: object
      description: Canonical org-options payload. `departments[].teams` is the authoritative shape as of v1.8.
      properties:
        departments:
          type: array
          description: Canonical department tree. Each department entry carries its nested `teams` array.
          items:
            $ref: '#/components/schemas/DepartmentOption'
        teams_by_department:
          type: object
          deprecated: true
          description: "Deprecated compatibility mirror retained in v1.8. Clients should switch to `departments[].teams`. Responses that include this field emit `Deprecation: version=\"v1.8\"`."
          additionalProperties:
            type: array
            items:
              type: string
        unassigned_pool_enabled:
          type: boolean
        configured_assignments:
          type: array
          items:
            $ref: '#/components/schemas/ConfiguredUserAssignment'
    AuthSession:
      type: object
      properties:
        session_id: { type: string }
        token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_at:
          type: string
          format: date-time
    AuthResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/WorkflowUser'
        session:
          $ref: '#/components/schemas/AuthSession'
    WorkflowTraceEvent:
      type: object
      description: Lightweight business trace event used by the business tracing and AI insight page.
      properties:
        id: { type: integer }
        event_id: { type: string }
        trace_id: { type: string }
        event_source:
          type: string
          enum: [api, frontend, system, integration]
        event_type:
          type: string
          example: api_request
        action: { type: string }
        actor_id:
          type: integer
          nullable: true
        actor_username: { type: string }
        actor_source: { type: string }
        actor_auth_mode:
          $ref: '#/components/schemas/PlaceholderAuthMode'
        actor_roles:
          type: array
          items:
            $ref: '#/components/schemas/IdentityRoleCode'
        actor_department: { type: string }
        actor_team: { type: string }
        route_method: { type: string }
        route_path: { type: string }
        route_full_path: { type: string }
        http_status:
          type: integer
          nullable: true
        latency_ms:
          type: integer
          nullable: true
        client_ip: { type: string }
        user_agent: { type: string }
        page_url: { type: string }
        page_name: { type: string }
        component_id: { type: string }
        task_id:
          type: integer
          nullable: true
        task_module_id:
          type: integer
          nullable: true
        module_key: { type: string }
        sku_code: { type: string }
        task_sku_item_id:
          type: integer
          nullable: true
        asset_id:
          type: integer
          nullable: true
        design_asset_id:
          type: integer
          nullable: true
        task_asset_id:
          type: integer
          nullable: true
        integration_call_log_id:
          type: integer
          nullable: true
        resource_type: { type: string }
        resource_id: { type: string }
        outcome: { type: string }
        payload:
          type: object
          additionalProperties: true
          nullable: true
        occurred_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    WorkflowTraceEventRecordRequest:
      type: object
      required: [event_type]
      properties:
        event_type: { type: string }
        action: { type: string }
        page_url: { type: string }
        page_name: { type: string }
        component_id: { type: string }
        task_id:
          type: integer
          nullable: true
        task_module_id:
          type: integer
          nullable: true
        module_key: { type: string }
        sku_code: { type: string }
        task_sku_item_id:
          type: integer
          nullable: true
        asset_id:
          type: integer
          nullable: true
        design_asset_id:
          type: integer
          nullable: true
        task_asset_id:
          type: integer
          nullable: true
        integration_call_log_id:
          type: integer
          nullable: true
        resource_type: { type: string }
        resource_id: { type: string }
        outcome: { type: string }
        payload:
          type: object
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time
    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    ProductSearchMatchedMapping:
      type: object
      properties:
        mapping_id: { type: integer }
        category_code: { type: string }
        search_entry_code: { type: string }
        erp_match_type:
          $ref: '#/components/schemas/CategoryERPMatchType'
        erp_match_value: { type: string }
        secondary_condition_key: { type: string }
        secondary_condition_value: { type: string }
        tertiary_condition_key: { type: string }
        tertiary_condition_value: { type: string }
        is_primary: { type: boolean }
        priority: { type: integer }
    TaskProductSelectionSummary:
      type: object
      description: Lightweight original-product provenance summary for task list and task-board consumption. Local mapped-search provenance remains supported, and an additive ERP Bridge snapshot may be included for the selected external product.
      properties:
        selected_product_id:
          type: integer
          nullable: true
        selected_product_name: { type: string }
        selected_product_sku_code: { type: string }
        matched_category_code:
          type: string
          description: Category code that ultimately matched the chosen local ERP product.
        matched_search_entry_code:
          type: string
          description: First-level search-entry code used while locating the chosen local ERP product.
        source_product_id:
          type: integer
          nullable: true
        source_product_name: { type: string }
        source_match_type:
          type: string
          description: |
            Stable provenance source label.
            Typical values include `mapped_product_search`, `manual_existing_product_binding`,
            `legacy_existing_product_binding`, and ERP-origin labels such as `erp_bridge_keyword_search`.
            There is no separate `product_selection.erp_product.source`; use this field as the source indicator.
        source_match_rule:
          type: string
          description: Stable lightweight rule/value summary for the local provenance path.
        source_search_entry_code:
          type: string
          description: Persisted first-level ERP search-entry code used before the final product was selected.
        erp_product:
          allOf: [{ $ref: '#/components/schemas/ERPBridgeProductSnapshot' }]
          description: Primary SKU nested ERP snapshot object. Read nested sku/product fields from this object.
          nullable: true
    TaskProductSelectionContext:
      type: object
      description: Full original-product provenance contract for task read and detail views. It extends the lightweight summary with the local matched mapping snapshot and an additive ERP Bridge product snapshot.
      properties:
        selected_product_id:
          type: integer
          nullable: true
        selected_product_name: { type: string }
        selected_product_sku_code: { type: string }
        matched_category_code:
          type: string
          description: Category code returned by `GET /v1/products/search` for the matched local mapping rule.
        matched_search_entry_code:
          type: string
          description: First-level search-entry code returned by `GET /v1/products/search` for original-product picker narrowing.
        matched_mapping_rule:
          allOf: [{ $ref: '#/components/schemas/ProductSearchMatchedMapping' }]
          nullable: true
        source_product_id:
          type: integer
          nullable: true
        source_product_name: { type: string }
        source_match_type:
          type: string
          description: |
            Trace label describing how the selected existing product was located.
            Typical values include `mapped_product_search`, `manual_existing_product_binding`,
            `legacy_existing_product_binding`, and ERP-origin labels such as `erp_bridge_keyword_search`.
            There is no separate `product_selection.erp_product.source`; use this field as the source indicator.
        source_match_rule:
          type: string
          description: Lightweight trace string for the applied product-match rule. For mapped search this normally mirrors the matched mapping value.
        source_search_entry_code:
          type: string
          description: Persisted first-level ERP search-entry code used before the concrete product was selected.
        erp_product:
          allOf: [{ $ref: '#/components/schemas/ERPBridgeProductSnapshot' }]
          description: Primary SKU nested ERP snapshot object. Read nested sku/product fields from this object.
          nullable: true
    ERPBridgeProduct:
      type: object
      description: Normalized ERP product contract returned by the MAIN facade. `product_id` is the stable lookup key emitted by `GET /v1/erp/products` and accepted by `GET /v1/erp/products/{id}`. Empty strings mean the backend could not obtain that field from bridge/category normalization; frontend should render its own placeholder for empty `image_url`.
      properties:
        product_id:
          type: string
          description: Opaque ERP facade lookup key returned by list and accepted by detail/binding flows.
        sku_id:
          type: string
          description: Canonical ERP SKU identifier.
        i_id:
          type: string
          description: Canonical ERP style identifier.
        sku_code:
          type: string
          description: Compatibility display code. This is not equivalent to `sku_id` or `i_id`.
        name:
          type: string
          description: Canonical ERP product display name.
        product_name: { type: string }
        short_name:
          type: string
          description: Canonical ERP short name.
        category_id:
          type: string
          description: Canonical category id resolved by MAIN when the category catalog can map the item; otherwise empty string.
