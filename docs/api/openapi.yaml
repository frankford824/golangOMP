  /v1/asset-workbench/overview-search:
    get:
      summary: Search asset workbench overview
      description: Unified search across client-visible operational materials, system assets for managers, uploaded files, submissions, and piecework items. Date filters use Beijing business-day input when YYYY-MM-DD is supplied.
      tags: [AssetWorkbench, ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: bearer_authenticated
        required_roles: [AssetSubmitter, AssetManager, AssetSettlement, SuperAdmin]
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Search by code, order number, filename, template, submitter, or material keyword.
        - in: query
          name: scope
          schema: { type: string, enum: [all, operational, files, orders] }
          description: Limits search to operational materials, uploaded files, order/piecework rows, or all sources.
        - in: query
          name: creator
          schema: { type: string }
        - in: query
          name: date_from
          schema: { type: string }
          description: RFC3339 timestamp or YYYY-MM-DD in Beijing time.
        - in: query
          name: date_to
          schema: { type: string }
          description: RFC3339 timestamp or YYYY-MM-DD in Beijing time.
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Unified overview search result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: &AssetWorkbenchOverviewRow
                          type: object
                          properties:
                            source:
                              type: string
                              enum: [system_asset, client_material, submission_file, submission, piecework_item]
                            scope:
                              type: string
                              enum: [operational, files, orders]
                            source_label: { type: string }
                            id: { type: integer }
                            title: { type: string }
                            primary_code: { type: string }
                            secondary_code: { type: string }
                            order_no: { type: string }
                            creator_user_id: { type: integer }
                            creator_name: { type: string }
                            business_month: { type: string }
                            status: { type: string }
                            page_count: { type: integer }
                            amount: { type: number }
                            created_at: { type: string, format: date-time }
                            updated_at: { type: string, format: date-time }
                            route_path: { type: string }
                            locate:
                              type: object
                              additionalProperties: true
                            meta_json:
                              type: object
                              additionalProperties: true
                      total: { type: integer }
                      page: { type: integer }
                      size: { type: integer }
        '400': { description: Invalid request }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
