  /v1/me/avatar-files/{filename}:
    get:
      summary: Read avatar file
      description: |
        Publicly serves an uploaded avatar file by its generated random filename so browsers can load it directly in `<img>`.
        Filenames are generated by the server, do not contain user IDs, and should be treated as opaque.
      tags: [Me, ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-owner-round: R4-SA-B
      x-public: true
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            pattern: '^avatar-[0-9a-f]{32}\.(jpg|jpeg|png|webp)$'
      responses:
        '200':
          description: Avatar image bytes
          headers:
            Cache-Control:
              schema: { type: string }
              description: Public browser cache header. Avatar updates use a newly generated URL.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '404':
          description: Avatar not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
