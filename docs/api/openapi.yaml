                type: integer
                format: int64
              username:
                type: string
              department_name:
                type: string
                nullable: true
    NotificationType:
      type: string
      description: "Application-scoped notification type. Main operations types and `asset_workbench_*` types are exposed through separate route families and cannot be read or marked across scopes."
      enum: [task_assigned_to_me, task_rejected, task_pending_audit, task_closed, claim_conflict, pool_reassigned, task_cancelled, system_broadcast, task_sku_sync_failed, asset_workbench_profile_incomplete, asset_workbench_submission_created, asset_workbench_qc_updated, asset_workbench_settlement_updated, asset_workbench_supplement_access, asset_workbench_preview_failed, asset_workbench_batch_job_completed, asset_workbench_batch_job_failed]
    Notification:
      type: object
      description: |
        Source: V1_INFORMATION_ARCHITECTURE §8.

        `payload` is a notification-type-specific JSON object. Stable routing fields are ids/codes;
        display-name fields may be included as denormalized snapshots for frontend rendering, but
        frontend must tolerate them being absent and fall back to id/code based labels.

        Current payload contract:

        - `task_assigned_to_me`: `task_id`; optional `task_no`, `task_type`, `module_key`,
          `action`, `assigned_by`, `assigned_by_name`, `designer_id`,
          `previous_designer_id`, `previous_handler_id`, `reason`, `remark`,
          `batch_request_id`.
        - `task_rejected`: `task_id`, `reject_reason`; optional `task_no`, `module_key`,
          `rejected_by`, `rejected_by_name`.
        - `task_pending_audit`: `task_id`, `module_key`, `pool_team_code`; optional
          `task_no`, `task_type`, `submitted_by`, `submitted_by_name`.
        - `task_closed`: `task_id`; optional `task_no`, `creator_id`, `creator_name`,
          `designer_id`, `designer_name`, `closed_by`, `closed_by_name`, `remark`.
        - `claim_conflict`: `task_id`, `module_key`; optional `task_no`, `winner_user_id`,
          `winner_user_name`.
        - `pool_reassigned`: `task_id`, `module_key`; optional `task_no`, `team_code`,
          `team_name`, `reassigned_by`, `reassigned_by_name`.
        - `task_cancelled`: `task_id`, `cancel_reason`, `cancelled_by`; optional `task_no`,
          `cancelled_by_name`, `module_key`.
        - `system_broadcast`: `title`, `content`; optional `broadcast_by`,
          `broadcast_by_name`, `broadcast_audience`, `broadcast_recipient_count`.
        - `task_sku_sync_failed`: `task_id`, `failed_count`, `failed_items`; optional
          `task_no`, `source`, `record_id`, `erp_sync_version`, `summary`, `url`.
        - `asset_workbench_profile_incomplete`: `source=asset_workbench`, `action=complete_profile`,
          `profile_id`, `user_id`, `missing_fields`.
        - `asset_workbench_submission_created`: `source=asset_workbench`, `action=open_upload_overview`,
          `submission_id`, `submission_no`, `business_month`, `uploader_id`, `uploader_name`,
          `item_count`, `file_count`.
        - `asset_workbench_qc_updated`: `source=asset_workbench`, `action=open_drive`, `item_id`,
          `submission_id`, `payee_user_id`, `qc_status`, `reason`, `reviewed_by`, `reviewed_at_utc`.
        - `asset_workbench_settlement_updated`: `source=asset_workbench`, `action=open_settlement`,
          `batch_id`, `payee_user_id`, `business_months`, `status`, `confirmed_at`.
        - `asset_workbench_supplement_access`: `source=asset_workbench`, `action=open_settlement`,
          `permission_id`, `payee_user_id`, `business_month`, `enabled`, `reason`, `updated_by`.
        - Other `asset_workbench_*` values are reserved for their named asset-workbench lifecycle and
          always remain in the asset-workbench notification scope.
      properties:
        id:
          type: integer
        notification_type:
          $ref: '#/components/schemas/NotificationType'
        payload:
          type: object
          description: Notification-type-specific payload. See `Notification` schema description for the per-type field list.
          additionalProperties: true
        is_read:
          type: boolean
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    WebPushConfig:
      type: object
      properties:
        enabled:
          type: boolean
        public_key:
          type: string
        vapid_key_hash:
          type: string
        subject:
          type: string
        reason:
          type: string
    WebPushSubscriptionInput:
