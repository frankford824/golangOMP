  /v1/tasks/excel-assist/parse-excel:
    post:
      summary: Parse a single-task Excel assist file
      description: |
        Parses a single-task Excel assist upload into a `draft` plus row-level `violations`. Does not create tasks.
        `mode` must be `single`. For `new_product_development`, required columns: `产品款式编码`, `产品名称`, `设计要求`.
        For `original_product_development`, required: `SKU编码`, `修改要求`; optional `规格尺寸`, `备注`.
        Parsed `sku_code` values are resolved through ERP product search; unknown SKU returns `product_not_found`.
        More than one non-empty data row returns `multiple_rows_not_allowed`. Invalid quantity returns `invalid_quantity`.
        Parsed `product_i_id` values for new-product development are validated against ERP i_id options when configured.
      tags: [Tasks, ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-owner-round: R5
      x-permissions: [task.create]
      x-rbac-placeholder:
        auth_mode: session_token_capability_enforced
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [task_type, mode, file]
              properties:
                task_type:
                  type: string
                  enum: [new_product_development, original_product_development]
                mode:
                  type: string
                  enum: [single]
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Excel parse draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExcelAssistParseResult'
