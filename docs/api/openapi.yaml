  /v1/notifications/broadcast:
    post:
      summary: Broadcast a notification to one, many, or all users
      description: |
        Creates persistent `system_broadcast` notifications for active recipients. Selected-user
        and full-system broadcasts require the explicit high-risk `system.manage` capability.
        Legacy role names do not grant this operation.
      tags: [Notifications, ReadyForFrontend]
      x-api-readiness: ready_for_frontend
