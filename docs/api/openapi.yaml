    post:
      summary: Create asset workbench submission
      description: |
        Creates uploaded work records. Client uploads no longer need a frontend "template/type" selection:
        when an item omits `difficulty_class`, the backend derives it from the uploaded session's
        upload-directory difficulty snapshot. New integrations should submit by upload directory and
        difficulty snapshot, not by legacy template assignment.
