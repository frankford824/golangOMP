  /v1/asset-workbench/settlement/report:
    get:
      summary: Get asset workbench settlement report
      description: Read-only piecework report for one business month. Rows are split into normal piecework and supplement piecework, with distinct non-empty `order_no` counts and difficulty-level metrics.
      tags: [AssetWorkbench, ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: bearer_authenticated
        required_roles: [AssetSettlement, SuperAdmin]
      parameters:
        - in: query
          name: business_month
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{2}$'
      responses:
        '200':
          description: Settlement report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      business_month: { type: string }
                      difficulty_classes:
                        type: array
                        items: { type: string }
                      rows:
                        type: array
                        items: &AssetWorkbenchSettlementReportRow
                          type: object
                          properties:
                            payee_user_id: { type: integer }
                            business_month: { type: string }
                            row_type: { type: string, enum: [normal_piecework, supplement_piecework, total] }
                            creator_name: { type: string }
                            job_grade: { type: string }
                            created_date: { type: string, format: date, description: Earliest upload or supplement creation date included in this monthly aggregate row. }
                            created_date_end: { type: string, format: date, description: Latest upload or supplement creation date included in this monthly aggregate row. }
                            order_count: { type: integer }
                            item_count: { type: integer }
                            page_count: { type: integer }
                            gross_amount: { type: number }
                            error_count: { type: integer }
                            deduction_amount: { type: number }
                            welfare_amount: { type: number }
                            supplement_amount: { type: number }
                            net_amount: { type: number }
                            error_rate: { type: number, description: error_count / page_count }
                            page_count_share: { type: number, description: row page_count / month total page_count }
                            error_count_share: { type: number, description: row error_count / month total error_count }
                            month_amount_share: { type: number, description: row net_amount / month total net_amount }
                            difficulty_metrics:
                              type: array
                              items: &AssetWorkbenchSettlementReportDifficultyMetric
                                type: object
                                properties:
                                  difficulty_class: { type: string }
                                  order_count: { type: integer }
                                  item_count: { type: integer }
                                  page_count: { type: integer }
                                  gross_amount: { type: number }
                                  error_count: { type: integer }
                                  deduction_amount: { type: number }
                                  error_rate: { type: number, description: difficulty error_count / difficulty page_count }
                                  page_count_share: { type: number, description: difficulty page_count / row page_count }
                                  error_count_share: { type: number, description: difficulty error_count / row error_count }
                                  month_page_count_share: { type: number, description: difficulty page_count / month total page_count }
                      totals: *AssetWorkbenchSettlementReportRow
                      generated_at: { type: string, format: date-time }
                      order_count_policy: { type: string, enum: [distinct_non_empty_order_no] }
                      settlement_data_mode: { type: string, enum: [unconfirmed_settleable_items_and_approved_supplements] }
        '400': { description: Invalid request }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
  /v1/asset-workbench/settlement/supplements:
    get:
      summary: List asset workbench settlement supplements
      description: Lists manual settlement supplement rows. Settlement roles can page, sort, and exact-filter by payee, month, file/work name, status, and supplement date.
      tags: [AssetWorkbench, ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: bearer_authenticated
        required_roles: [AssetSettlement, SuperAdmin]
      parameters:
        - in: query
          name: business_month
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{2}$'
        - in: query
          name: payee_user_id
          schema: { type: integer }
        - in: query
          name: order_no
          schema: { type: string }
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, approved, in_batch, settled, voided]
        - in: query
          name: supplement_date
          description: Exact supplement date filter.
          schema: { type: string, format: date }
        - in: query
          name: supplement_date_from
          description: Inclusive supplement date lower bound.
          schema: { type: string, format: date }
        - in: query
          name: supplement_date_to
          description: Inclusive supplement date upper bound.
          schema: { type: string, format: date }
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [id, business_month, payee_user_id, order_no, supplement_date, status, gross_amount, created_at, updated_at]
            default: supplement_date
        - in: query
          name: sort_dir
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Supplement rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: &AssetWorkbenchSettlementSupplementRow
                      type: object
                      properties:
                        id: { type: integer }
                        payee_user_id: { type: integer }
                        business_month: { type: string }
                        linked_batch_id: { type: integer, nullable: true }
                        status: { type: string, enum: [draft, approved, in_batch, settled, voided] }
                        order_no: { type: string, description: File/work display name used for duplicate hints. }
                        supplement_date:
                          type: string
                          format: date
                          nullable: true
                          description: Desired supplement date for display and indexed server-side filtering; settlement still uses business_month.
                        difficulty_class: { type: string }
                        finalized: { type: boolean }
                        page_count: { type: integer }
                        gross_amount: { type: number }
                        files:
                          type: array
                          description: Files uploaded through the normal OSS upload-directory and preview pipeline for this supplement.
                          items: *AssetWorkbenchSubmissionFileRow
                        duplicate_hint_json:
                          type: object
                          additionalProperties: true
                          properties:
                            has_duplicates: { type: boolean }
                            submission_item_ids:
                              type: array
                              items: { type: integer }
                            supplement_ids:
                              type: array
                              items: { type: integer }
                            supplement_date:
                              type: string
                              format: date
                              description: Desired supplement date for display; settlement still uses business_month.
                        created_by: { type: integer }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
                  pagination:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      page_size: { type: integer }
        '400': { description: Invalid request }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
    post:
      summary: Create asset workbench settlement supplement
      description: Creates one supplement in the current Asia/Shanghai natural month. Settlement roles may create a manual row. Asset submitters may create only their own row, must supply uploaded `upload_session_ids`, and must still have an enabled current-month permission when the transaction locks the permission row. Uploaded supplements reuse normal upload directories, pricing, file query, and preview, but their linked submission item has `entry_kind=supplement` and is excluded from normal piecework settlement.
      tags: [AssetWorkbench, ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-rbac-placeholder:
        auth_mode: bearer_authenticated
        required_roles: [AssetSubmitter, AssetManager, AssetSettlement, SuperAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payee_user_id, business_month, order_no, difficulty_class, page_count, gross_amount]
              properties:
                payee_user_id: { type: integer }
                business_month:
                  type: string
                  pattern: '^[0-9]{4}-[0-9]{2}$'
                order_no:
                  type: string
                  description: File/work display name used for duplicate hints.
                supplement_date:
                  type: string
                  format: date
                  description: Historical target date for display and duplicate checks; it may be outside business_month.
                difficulty_class: { type: string }
                finalized: { type: boolean }
                page_count: { type: integer, minimum: 1 }
                gross_amount: { type: number, minimum: 0 }
                status: { type: string, enum: [draft, approved] }
                upload_session_ids:
                  type: array
                  description: Uploaded asset-workbench sessions. Required for a non-settlement actor; all sessions must belong to the actor and use one upload-directory difficulty.
                  items: { type: string }
      responses:
        '201':
          description: Created supplement
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: *AssetWorkbenchSettlementSupplementRow
        '400': { description: Invalid request }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden, including permission closed before the linked upload was recorded }
