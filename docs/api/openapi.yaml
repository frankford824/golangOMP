              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      months:
                        type: array
                        minItems: 1
                        maxItems: 1
                        items: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        '400': { description: Invalid payee_user_id }
        '401': { description: Unauthenticated }
