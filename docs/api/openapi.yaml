  /v1/tasks/{id}/business-info:
    patch:
      summary: Update task business-info and generic cost fields
      description: |
        Maintains the task's editable business information. `catalog.manage` may update tasks in its
        stable data scope. `task.create` may update ordinary fields only for a task created by the
        current actor. Completed, archived, and cancelled tasks are immutable through this endpoint.
        Manual cost, cost-rule selection, and forced filing controls remain restricted to
        `catalog.manage`. When category plus minimal
        width/height/area/quantity/process inputs are present, the backend also triggers skeleton
        cost preview and persists `estimated_cost`, rule provenance, governed
        `matched_rule_version`, and manual-review state. Existing-product tasks may also persist or
        rebind `product_selection` here so the selected product stays traceable back to local
        mapped-search provenance and optional ERP Bridge external snapshot fields.
        Filing now uses backend state-machine auto triggers and idempotent payload comparison.
        Legacy `trigger_filing` and `filed_at` remain compatibility forced triggers.
        Bridge remains the ERP/JST adapter and mutation executor; MAIN decides business boundary
        and records filing traces/status. `cost_price` is the
        current effective internal cost, while `manual_cost_override` distinguishes business-side
        override from system prefill; `prefill_source`, `prefill_at`, `override_actor`, and
        `override_at` provide governance trace, and override state changes append a dedicated
        `cost_override_events` audit record. This remains a narrow task master-data and ERP filing
        boundary. Historical tasks are not silently recomputed by later rule changes; governed
        recalculation runs handle explicit refreshes.
      tags: [Tasks, ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-permissions: [catalog.manage, task.create]
      x-rbac-placeholder:
        auth_mode: session_token_capability_enforced
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskBusinessInfoRequest'
      responses:
