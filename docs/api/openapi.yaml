        Parses the batch-create workbook into `batch_items`. For `new_product_development`, only `产品名称` and `设计要求` are required. `产品款式编码` is the canonical column for mapping `batch_items[].product_i_id`; legacy column `商品编码` is still accepted for backward compatibility. When both columns exist in one row, parser behavior is: both non-empty and equal -> accept; both non-empty but different -> row-level conflict violation; only one non-empty -> use that value. Parsed i_id values are validated against ERP i_id options. If users pasted images into workbook rows, the backend extracts the row-anchored pictures, uploads them through the task reference upload flow, and returns row-level `reference_file_refs`; frontend should only preview/confirm and submit the returned refs unchanged.
