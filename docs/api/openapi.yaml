  /v1/search:
    get:
      summary: Perform a global search
      description: |
        Source: V1_INFORMATION_ARCHITECTURE §4.2. Global search across tasks / assets / products / users.
        The route hydrates the caller's explicit access policy before searching. Internal task-resource
        groups require `asset.view` and are filtered by self / own department / own team / selected
        organization / global scope. AssetSubmitter results are limited to published finalized revisions.
        Resource-group results are pinned to `finalized_revision_id`; staged files and historical
        revisions are never returned. `users[]` remains limited to authorized people-management views.
      tags: [Search, ReadyForFrontend]
      x-api-readiness: ready_for_frontend
      x-owner-round: R4-SA-D
      x-permissions: [account.use]
      x-rbac-placeholder:
        auth_mode: session_token_capability_enforced
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: scope
          schema:
            type: string
            enum: [all, tasks, assets, products, users]
            default: all
        - in: query
          name: limit
          description: Max items per result array. Default 20 (IA §4.2).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - in: query
          name: mode
          description: Auto keeps identifier-like input exact and uses hybrid retrieval only for natural language.
          schema:
            type: string
            enum: [auto, exact, hybrid]
            default: auto
      responses:
        '200':
          description: Grouped search results
          content:
            application/json:
              schema:
                type: object
                required: [query, results, retrieval]
                properties:
                  query:
                    type: string
                  results:
                    $ref: '#/components/schemas/SearchResultGroup'
                  retrieval:
                    $ref: '#/components/schemas/SearchRetrievalMeta'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
