                                gross_amount: { type: number }
                                pricing_status: { type: string }
                                qc_status: { type: string }
                                settlement_status: { type: string }
                            files:
                              type: array
                              items:
                                type: object
                                properties:
                                  id: { type: integer }
                                  submission_id: { type: integer }
                                  submission_item_id: { type: integer }
                                  upload_directory_id: { type: integer, nullable: true }
