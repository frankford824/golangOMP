openapi: 3.0.3
info:
  title: Yongbo OA 扩展 API
  version: 1.0.0
  description: 仅描述 cmd/oa-extension 挂载的 OA 扩展接口。使用既有主站用户 Bearer，业务权限由服务端按账号与范围判定。任务、成本、库存及资产业务仍使用原生 /v1 合同。
servers:
- url: /
externalDocs:
  description: 主站与资产工作台原生业务合同
  url: openapi.yaml
security:
- MainBearer: []
paths:
  /oa-api/health:
    get:
      summary: 扩展库健康状态
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      mode:
                        type: string
                      identity:
                        type: string
                required:
                - data
        '503':
          $ref: '#/components/responses/HTTP503'
  /oa-api/me:
    get:
      summary: 读取主站身份与 OA 有效权限
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Actor'
                required:
                - data
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '503':
          $ref: '#/components/responses/HTTP503'
  /oa-api/orders/hourly:
    get:
      summary: 按北京时间小时汇总有效订单应付，两天以内，默认剔除刷单
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: 含起日，北京时间；不得早于 2026-06-01
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: 含止日，北京时间；不得晚于今天
      - in: query
        name: shop_id
        schema:
          type: string
      - in: query
        name: platform
        schema:
          type: string
        description: 省略时仅默认电商范围，排除线下店铺和其它平台
      - in: query
        name: include_brush
        schema:
          type: string
          enum:
          - '0'
          - '1'
        description: 1 表示纳入刷单
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/OrderResult'
                    - type: object
                      properties:
                        rows:
                          type: array
                          items:
                            type: object
                            properties:
                              day:
                                type: string
                                format: date
                              hour:
                                type: integer
                                minimum: 0
                                maximum: 23
                              payable_amount:
                                type: string
                                description: 小时应付合计，十进制字符串
                required:
                - data
          headers:
            X-OA-Order-Cache:
              description: OA 应用查询缓存状态。范围为空时可省略，与 ClickHouse 查询缓存独立。
              schema:
                type: string
                enum:
                - hit
                - miss
                - coalesced
                - stale
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '503':
          $ref: '#/components/responses/HTTP503'
        '504':
          $ref: '#/components/responses/HTTP504'
  /oa-api/tasks/batch-archive:
    post:
      summary: 手动批量归档任务
      description: >
        需要 task.archive（具有全局任务查看权限的超管）。可归档已结单或已取消的任务。
        已归档的任务计入幂等结果。整批在同一事务校验和归档，为每条状态变更追加任务审计事件。
        任何不存在、未完结的任务或写入失败都会阻止整批变更。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [task_ids]
              properties:
                task_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 已归档及此前已归档任务数量
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [archived, already_archived]
                    properties:
                      archived: { type: integer, minimum: 0 }
                      already_archived: { type: integer, minimum: 0 }
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '503':
          $ref: '#/components/responses/HTTP503'
  /oa-api/pricing/preview:
    post:
      summary: Resolve shop SKU cost evidence for OA review
      description: >-
        OA extension only. Requires catalog.view. Reads the canonical completed SKU and
        respects the existing task read scope. Uses the existing rule preview with explicit
        ERP or product style binding and the stored SKU specifications. Returns each SKU
        independently, including unknown, protected and missing-evidence states. This operation
        does not write.
      tags: [OA]
      x-permissions: [catalog.view]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sku_codes]
              properties:
                sku_codes:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Ordered results for each distinct SKU and the current confirmation capability.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [rows, can_confirm]
                    properties:
                      rows:
                        type: array
                        items:
                          type: object
                          required: [sku_code, current_cost, suggested_cost, state, reason]
                          properties:
                            sku_code: { type: string }
                            product_name: { type: string }
                            task_id: { type: integer, format: int64 }
                            sku_item_id: { type: integer, format: int64 }
                            current_cost: { type: number, nullable: true }
                            suggested_cost: { type: number, nullable: true }
                            state: { type: string, enum: [ready, confirmed, protected, needs_review, not_found, ambiguous, unavailable, incomplete] }
                            reason: { type: string }
                            token: { type: string, description: Optimistic confirmation token present for ready rows. }
                            input:
                              allOf: [{ $ref: '#/components/schemas/CostRulePreviewRequest' }]
                            rule:
                              allOf: [{ $ref: '#/components/schemas/CostRulePreviewMatch' }]
                            applied_rules:
                              type: array
                              items: { $ref: '#/components/schemas/CostRulePreviewMatch' }
                            match_mode: { type: string }
                            calculation:
                              type: object
                              additionalProperties: true
                            review:
                              type: object
                              properties:
                                id: { type: integer, format: int64 }
                                batch_id: { type: integer, format: int64 }
                                operator_id: { type: integer, format: int64 }
                                operator: { type: string }
                                reason: { type: string }
                                confirmed_at: { type: string, format: date-time }
                                accepted_cost: { type: number }
                                evidence: { type: object, additionalProperties: true }
                      can_confirm: { type: boolean }
        '400': { description: Invalid SKU batch. }
        '401': { description: Unauthenticated. }
        '403': { description: Missing catalog read capability. }
  /oa-api/pricing/confirm:
    post:
      summary: Confirm a batch of selected OA SKU costs
      description: >-
        OA extension only. Revalidates each selected SKU from the current canonical sources.
        All rows commit atomically as immutable OA evidence with the accepting operator,
        explanation and timestamp. This operation does not change core costs, ERP or settlement.
        Retrying the same request identifier with identical content returns the original batch.
        Materially changed evidence can be reconfirmed as a new version.
      tags: [OA]
      x-permissions: [catalog.view, catalog.manage, erp.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id, reason, items]
              properties:
                request_id: { type: string, minLength: 16, maxLength: 64, pattern: '^[a-zA-Z0-9-]+$' }
                reason: { type: string, minLength: 1, maxLength: 200 }
                items:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items:
                    type: object
                    additionalProperties: false
                    required: [sku_code, token]
                    properties:
                      sku_code: { type: string, minLength: 1, maxLength: 128 }
                      token: { type: string, minLength: 64, maxLength: 64, pattern: '^[a-f0-9]+$' }
      responses:
        '200':
          description: Committed OA batch and confirmed SKU evidence
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [batch_id, rows]
                    properties:
                      batch_id: { type: integer, format: int64 }
                      rows:
                        type: array
                        items: { type: object, additionalProperties: true }
        '400': { description: Invalid confirmation input. }
        '401': { description: Unauthenticated. }
        '403': { description: Missing confirmation capability. }
        '409': { description: Evidence changed, a concurrent review committed or the request identifier was reused for different content. }
        '503': { description: The batch could not be written or read. Retry with the same request identifier. }
