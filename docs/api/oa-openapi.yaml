        '503':
          $ref: '#/components/responses/HTTP503'
components:
  securitySchemes:
    MainBearer:
      type: http
      scheme: bearer
  schemas:
    # Cost rule evidence fields mirror the core rule-preview contract.
    CostRulePreviewMatch:
      type: object
      properties:
        rule_id:
          type: integer
        rule_name:
          type: string
        rule_version:
          type: integer
        rule_type:
          $ref: '#/components/schemas/CostRuleType'
        priority:
          type: integer
        source:
          type: string
        governance_status:
          $ref: '#/components/schemas/CostRuleGovernanceStatus'
    CostRuleType:
      type: string
      enum:
      - cost_model
      - fixed_unit_price
      - area_threshold_surcharge
      - minimum_billable_area
      - size_based_formula
      - manual_quote
      - special_process_surcharge
    CostRuleGovernanceStatus:
      type: string
      description: Governance/effective-window status for one persisted cost-rule row.
        This is not an approval-state machine.
      enum:
      - inactive
      - scheduled
      - effective
      - expired
      - no_match
    CostRulePreviewRequest:
      type: object
      properties:
        model:
          allOf:
          - $ref: '#/components/schemas/CostModel'
          description: Optional unsaved model for read-only simulation. Never saved or
            bound by this operation.
        input:
          $ref: '#/components/schemas/CostInput'
        category_id:
          type: integer
          nullable: true
        category_code:
          type: string
        width:
          type: number
          format: double
          nullable: true
          description: Width in metres for rule-preview calculations.
        height:
          type: number
          format: double
          nullable: true
          description: Height in metres for rule-preview calculations.
        area:
          type: number
          format: double
          nullable: true
          description: Billable area in square metres.
        quantity:
          type: integer
          format: int64
          nullable: true
        process:
          type: string
        notes:
          type: string
        erp_i_id:
          type: string
          description: ERP item identifier used for exact governed-rule binding.
        product_i_id:
          type: string
          description: Product item identifier used for exact governed-rule binding when
            ERP i_id is absent.
    CostInput:
      type: object
      description: Structured inputs for one SKU sales unit. Total/layout/face-list areas
        already include all pieces. Order quantity never multiplies the resulting SKU
        unit cost. Stored in SKU variant_json.cost_input; patch via cost_input.
      properties:
        area_mode:
          type: string
          enum:
          - flat
          - faces
          - layout
          - total
        width_m:
          type: number
          minimum: 0
        height_m:
          type: number
          minimum: 0
        depth_m:
          type: number
          minimum: 0
        area_m2:
          type: number
          minimum: 0
        thickness_mm:
          type: number
          minimum: 0
        shape:
          type: string
          enum:
          - ''
          - normal
          - irregular
          description: Explicit shape selection. A variant price table requires normal
            or irregular; missing shape never defaults to normal. Free text is never used
            to infer shape or its billable area.
        pieces:
          type: integer
          minimum: 1
          maximum: 100000
        faces:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CostFace'
        processes:
          type: object
          description: Explicit slot, punch, laminate, double_sided choices. Missing configured
            choices require confirmation; prose is never used to guess these values.
          additionalProperties:
            type: boolean
        hole_count:
          type: integer
          minimum: 0
          maximum: 100000
        process_length_m:
          type: number
          minimum: 0
    CostFace:
      type: object
      required:
      - width_m
      - height_m
      - count
      properties:
        width_m:
          type: number
          minimum: 0
          exclusiveMinimum: true
        height_m:
          type: number
          minimum: 0
          exclusiveMinimum: true
        count:
          type: integer
          minimum: 1
          maximum: 100000
    CostModel:
      type: object
      description: Bounded model configuration, persisted as JSON in formula_expression
        when rule_type=cost_model. One active model per matched group is allowed at evaluation;
        multiple models fail closed. Model replaces legacy components in that group. Source
        names are provenance, not approval.
      required:
      - version
      - material
      - basis
      - unit_price
      - multiplier
      properties:
        version:
          type: integer
          enum:
          - 1
        material:
          type: string
          minLength: 1
        basis:
          type: string
          enum:
          - area
          - piece
          - set
          - manual
        unit_price:
          type: number
          minimum: 0
        multiplier:
          type: number
          minimum: 0
          exclusiveMinimum: true
        minimum:
          type: number
          minimum: 0
        small_area_threshold:
          type: number
          minimum: 0
        small_area_surcharge:
          type: number
          minimum: 0
        thickness_prices:
          type: array
          maxItems: 32
          items:
            type: object
            required:
            - thickness_mm
            - unit_price
            properties:
              thickness_mm:
                type: number
                minimum: 0
                exclusiveMinimum: true
              unit_price:
                type: number
                minimum: 0
        variant_prices:
          type: array
          maxItems: 32
          description: Optional replacement unit prices by exact thickness and explicit
            shape. Mutually exclusive with thickness_prices. A single row with thickness_mm=0
            means no thickness distinction and cannot coexist with other rows. A null
            price remains unquoted; zero explicitly means free. When configured, unit_price
            is ignored and unmatched thickness, missing shape or an unquoted cell requires
            manual review. Existing models without this table keep their prior calculation
            for unchanged inputs.
          items:
            type: object
            required:
            - thickness_mm
            - normal_price
            - irregular_price
            properties:
              thickness_mm:
                type: number
                minimum: 0
              normal_price:
                type: number
                minimum: 0
                nullable: true
              irregular_price:
                type: number
                minimum: 0
                nullable: true
        processes:
          type: array
          maxItems: 8
          items:
            type: object
            required:
            - code
            - unit
            - unit_price
            - multiplier
            properties:
              code:
                type: string
                enum:
                - slot
                - punch
                - laminate
                - double_sided
              unit:
                type: string
                enum:
                - sku
                - piece
                - hole
                - metre
                - area
              unit_price:
                type: number
                minimum: 0
              multiplier:
                type: number
                minimum: 0
                exclusiveMinimum: true
    Error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
