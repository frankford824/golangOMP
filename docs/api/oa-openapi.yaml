      description: 撤回仅限本人在首个节点尚未办结的待审批单，退回或撤回后可按原模板版本重提。只有当前审批节点经办人可审批；费用管理员作为当前审批人通过时可核减，并提供当前版本和理由。作废仅适用已批准待付款单据，由费用管理员或非申请人的出纳执行。付款仅限非申请人的授权出纳，使用当前核准金额、北京实际付款日期、真实交易流水及本人上传的回单。
