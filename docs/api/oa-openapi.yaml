      - in: query
        name: page_size
        schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      - in: query
        name: size
        description: page_size 的别名。两项都传时使用 page_size。
        schema: { type: integer, minimum: 1, maximum: 100 }
      - in: query
        name: q
        description: 匹配姓名、用户编号、工号和部门。
        schema: { type: string }
      - in: query
        name: id
        description: 精确匹配人员账号 ID。
        schema: { type: integer, format: int64, minimum: 1 }
      - in: query
        name: status
        schema: { type: string, enum: [active, inactive, deleted, missing] }
      - in: query
        name: sort
        schema: { type: string, enum: [id, name, status, department, employee_no, level], default: id }
      - in: query
        name: order
        schema: { type: string, enum: [asc, desc], default: asc }
      - in: query
        name: kind
        schema: { type: string, enum: [template, finance, pay, report] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      total: { type: integer, format: int64 }
                      page: { type: integer }
                      page_size: { type: integer }
                      size: { type: integer }
                      has_active_payer: { type: boolean, description: 全量授权中是否存在在职付款经办人 }
                      items:
                        type: array
                        items:
                          type: object
                          required: [id, name, department, employee_no, status, level, pay, report]
                          properties:
                            id: { type: integer, format: int64 }
                            name: { type: string }
                            department: { type: string }
                            employee_no: { type: integer, nullable: true }
                            status: { type: string, description: 人员账号状态，无法查到时为 missing }
                            level: { type: string, enum: [none, draft, publish] }
                            pay: { type: boolean }
                            report: { type: boolean }
        '400': { $ref: '#/components/responses/HTTP400' }
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '500':
          $ref: '#/components/responses/HTTP500'
        '503':
