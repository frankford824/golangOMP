  /oa-api/finance/notifications:
    get:
      summary: 列出费用待办和申请处理结果
      description: 待办按当前单据状态和访问权限计算，读取通知不会清除待办。处理结果仅向申请人提供。新增的终审通过、拒绝和付款结果计入未读；退回修改由待办提醒，旧历史不计入未读。
      parameters:
      - in: query
        name: todo_page
        schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
      - in: query
        name: result_page
        schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
      - in: query
        name: limit
        description: 每类列表的单页条数。
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      - in: query
        name: summary
        description: 传 1 时只计算计数，两个列表返回空数组。
        schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [todos, items, todo_count, result_count, unread_result_count]
                    properties:
                      todos:
                        type: array
                        description: 当前账号需要审批、修改退回申请或登记付款的单据，每张单据一项。
                        items: { $ref: '#/components/schemas/OAFinanceActivityItem' }
                      items:
                        type: array
                        description: 当前申请人的审批通过、退回、拒绝和付款结果。
                        items: { $ref: '#/components/schemas/OAFinanceActivityItem' }
                      approve_count: {type: integer, format: int64, minimum: 0}
                      pay_count: {type: integer, format: int64, minimum: 0}
                      todo_count: { type: integer, format: int64, minimum: 0 }
                      result_count: { type: integer, format: int64, minimum: 0 }
                      unread_result_count: { type: integer, format: int64, minimum: 0 }
                required:
                - data
        '400':
          description: 分页参数无效
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '500':
          $ref: '#/components/responses/HTTP500'
        '503':
          $ref: '#/components/responses/HTTP503'
  /oa-api/finance/notifications/{id}/read:
