openapi: 3.0.3
info:
  title: Yongbo OA 扩展 API
  version: 1.0.0
  description: 仅描述 cmd/oa-extension 挂载的 OA 扩展接口。使用既有主站用户 Bearer，业务权限由服务端按账号与范围判定。任务、成本、库存及资产业务仍使用原生 /v1 合同。
servers:
- url: /
externalDocs:
  description: 主站与资产工作台原生业务合同
  url: openapi.yaml
security:
- MainBearer: []
paths:
  /oa-api/health:
    get:
      summary: 扩展库健康状态
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      mode:
                        type: string
                      identity:
                        type: string
                required:
                - data
        '503':
          $ref: '#/components/responses/HTTP503'
  /oa-api/me:
    get:
      summary: 读取主站身份与 OA 有效权限
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Actor'
                required:
                - data
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '503':
          $ref: '#/components/responses/HTTP503'
  /oa-api/orders/summary:
    get:
      summary: 经营汇总
      description: 默认按店日使用 v_shop_day；纳入刷单改读有效订单。无明确核实成本时金额可为空。
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: 含起日，北京时间；不得早于 2026-06-01
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: 含止日，北京时间；不得晚于今天
      - in: query
        name: shop_id
        schema:
          type: string
      - in: query
        name: platform
        schema:
          type: string
        description: 省略时仅默认电商范围，排除线下店铺和其它平台
      - in: query
        name: include_brush
        schema:
          type: string
          enum:
          - '0'
          - '1'
        description: 1 表示纳入刷单
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/OrderResult'
                    - type: object
                      properties:
                        rows:
                          type: array
                          items:
                            type: object
                            properties:
                              day:
                                type: string
                                format: date
                              shop_id:
                                type: string
                              platform:
                                type: string
                              order_count: &id001
                                type: string
                                pattern: ^[0-9]+$
                                description: ClickHouse JSON UInt64 decimal string
                              payable_amount:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                              item_pay_total:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                              item_pay_verified_total:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                              cost_verified_total:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                                nullable: true
                              verified_gross:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                                nullable: true
                              verified_coverage:
                                type: number
                                nullable: true
                              verified_status:
                                type: string
                required:
                - data
          headers:
            X-OA-Order-Cache:
              description: OA 应用查询缓存状态。范围为空时可省略，与 ClickHouse 查询缓存独立。
              schema:
                type: string
                enum:
                - hit
                - miss
                - coalesced
                - stale
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '503':
          $ref: '#/components/responses/HTTP503'
        '504':
          $ref: '#/components/responses/HTTP504'
  /oa-api/orders/products:
    get:
      summary: 分页商品经营
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: 含起日，北京时间；不得早于 2026-06-01
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: 含止日，北京时间；不得晚于今天
      - in: query
        name: shop_id
        schema:
          type: string
      - in: query
        name: platform
        schema:
          type: string
        description: 省略时仅默认电商范围，排除线下店铺和其它平台
      - in: query
        name: include_brush
        schema:
          type: string
          enum:
          - '0'
          - '1'
        description: 1 表示纳入刷单
      - in: query
        name: sku
        schema:
          type: string
      - in: query
        name: product
        schema:
          type: string
      - in: query
        name: mine
        schema:
          type: string
          enum:
          - '0'
          - '1'
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          maximum: 10000
        description: 每页最多 100 条；has_more 指示后续页
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/OrderResult'
                    - type: object
                      properties:
                        rows:
                          type: array
                          items:
                            type: object
                            properties:
                              shop_id:
                                type: string
                              sku:
                                type: string
                              product_name:
                                type: string
                              shop_item_id:
                                type: string
                                nullable: true
                              quantity:
                                type: string
                              item_pay_total:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                              item_pay_verified_total:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                              cost_verified_total:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                                nullable: true
                              verified_gross:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                                nullable: true
                              verified_coverage:
                                type: number
                                nullable: true
                required:
                - data
          headers:
            X-OA-Order-Cache:
              description: OA 应用查询缓存状态。范围为空时可省略，与 ClickHouse 查询缓存独立。
              schema:
                type: string
                enum:
                - hit
                - miss
                - coalesced
                - stale
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '503':
          $ref: '#/components/responses/HTTP503'
        '504':
          $ref: '#/components/responses/HTTP504'
  /oa-api/orders/rankings:
    get:
      summary: 经营排行
      description: 人员排行限超级管理员，增长基期为等长紧邻区间，零基期不计算增长率。
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: 含起日，北京时间；不得早于 2026-06-01
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: 含止日，北京时间；不得晚于今天
      - in: query
        name: shop_id
        schema:
          type: string
      - in: query
        name: platform
        schema:
          type: string
        description: 省略时仅默认电商范围，排除线下店铺和其它平台
      - in: query
        name: include_brush
        schema:
          type: string
          enum:
          - '0'
          - '1'
        description: 1 表示纳入刷单
      - in: query
        name: group
        schema:
          type: string
          enum:
          - shop
          - platform
          - product
          - person
          - growth
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          maximum: 10000
        description: 每页最多 100 条；has_more 指示后续页
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/OrderResult'
                    - type: object
                      properties:
                        rows:
                          type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                              shop_id:
                                type: string
                              growth_status:
                                type: string
                              item_pay_total:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                              payable_amount:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                              baseline_amount:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                              growth_rate:
                                type: number
                                nullable: true
                required:
                - data
          headers:
            X-OA-Order-Cache:
              description: OA 应用查询缓存状态。范围为空时可省略，与 ClickHouse 查询缓存独立。
              schema:
                type: string
                enum:
                - hit
                - miss
                - coalesced
                - stale
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '503':
          $ref: '#/components/responses/HTTP503'
        '504':
          $ref: '#/components/responses/HTTP504'
