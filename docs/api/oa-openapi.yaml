openapi: 3.0.3
info:
  title: Yongbo OA 扩展 API
  version: 1.0.0
  description: 仅描述 cmd/oa-extension 挂载的 OA 扩展接口。使用既有主站用户 Bearer，业务权限由服务端按账号与范围判定。任务、成本、库存及资产业务仍使用原生 /v1 合同。
servers:
- url: /
externalDocs:
  description: 主站与资产工作台原生业务合同
  url: openapi.yaml
security:
- MainBearer: []
paths:
  /oa-api/data-alerts:
    get:
      summary: 超级管理员查看订单数据告警（北京时间）
      parameters:
      - in: query
        name: summary
        schema: { type: string, enum: ['1'] }
        description: 只返回未恢复数，items 为空
      responses:
        '200':
          description: 未恢复的 warning/critical 事件组数及最近 100 条事件
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      active_count: { type: integer }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            seq: { type: integer }
                            source: { type: string }
                            id: { type: string }
                            event: { type: string, enum: [firing, repeat, resolved] }
                            at: { type: string }
                            kind: { type: string }
                            severity: { type: string, enum: [critical, warning, info] }
                            title: { type: string }
                            message: { type: string }
        '401': { $ref: '#/components/responses/HTTP401' }
        '403': { $ref: '#/components/responses/HTTP403' }
        '503': { $ref: '#/components/responses/HTTP503' }
  /oa-api/health:
    get:
      summary: 扩展库健康状态
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      mode:
                        type: string
                      identity:
                        type: string
                required:
                - data
        '503':
          $ref: '#/components/responses/HTTP503'
  /oa-api/me:
    get:
      summary: 读取主站身份与 OA 有效权限
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Actor'
                required:
                - data
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '503':
          $ref: '#/components/responses/HTTP503'
  /oa-api/orders/hourly:
    get:
      summary: 按北京时间小时汇总有效订单应付，两天以内，默认剔除刷单
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: 含起日，北京时间；不得早于 2026-06-01
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: 含止日，北京时间；不得晚于今天
      - in: query
        name: shop_id
        schema:
          type: string
      - in: query
        name: platform
        schema:
          type: string
        description: 省略时仅默认电商范围，排除线下店铺和其它平台
      - in: query
        name: include_brush
        schema:
          type: string
          enum:
          - '0'
          - '1'
        description: 1 表示纳入刷单
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/OrderResult'
                    - type: object
                      properties:
                        rows:
                          type: array
                          items:
                            type: object
                            properties:
                              day:
                                type: string
                                format: date
                              hour:
                                type: integer
                                minimum: 0
                                maximum: 23
                              payable_amount:
                                type: string
                                description: 小时应付合计，十进制字符串
                required:
                - data
          headers:
            X-OA-Order-Cache:
              description: OA 应用查询缓存状态。范围为空时可省略，与 ClickHouse 查询缓存独立。
              schema:
                type: string
                enum:
                - hit
                - miss
                - coalesced
                - stale
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '503':
          $ref: '#/components/responses/HTTP503'
        '504':
          $ref: '#/components/responses/HTTP504'
  /oa-api/tasks/batch-archive:
    post:
      summary: 手动批量归档任务
      description: >
        需要 task.archive（具有全局任务查看权限的超管）。可归档已结单或已取消的任务。
        已归档的任务计入幂等结果。整批在同一事务校验和归档，为每条状态变更追加任务审计事件。
        任何不存在、未完结的任务或写入失败都会阻止整批变更。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [task_ids]
              properties:
                task_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 已归档及此前已归档任务数量
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [archived, already_archived]
                    properties:
                      archived: { type: integer, minimum: 0 }
                      already_archived: { type: integer, minimum: 0 }
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '503':
          $ref: '#/components/responses/HTTP503'
  /oa-api/pricing/preview:
    post:
      summary: Resolve shop SKU cost evidence for OA review
      description: >-
        OA extension only. Requires catalog.view. Reads the canonical completed SKU and
        respects the existing task read scope. Uses the existing rule preview with explicit
        ERP or product style binding and the stored SKU specifications. Returns each SKU
        independently, including unknown, protected and missing-evidence states. This operation
        does not write.
      tags: [OA]
      x-permissions: [catalog.view]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sku_codes]
              properties:
                sku_codes:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Read-only cost evidence for each distinct SKU.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [rows]
                    properties:
                      rows:
                        type: array
                        items:
                          type: object
                          required: [sku_code, current_cost, suggested_cost, state, reason]
                          properties:
                            sku_code: { type: string }
                            product_name: { type: string }
                            task_id: { type: integer, format: int64 }
                            sku_item_id: { type: integer, format: int64 }
                            current_cost: { type: number, nullable: true }
                            suggested_cost: { type: number, nullable: true }
                            state: { type: string, enum: [ready, protected, needs_review, not_found, ambiguous, unavailable, incomplete] }
                            reason: { type: string }
                            input:
                              allOf: [{ $ref: '#/components/schemas/CostRulePreviewRequest' }]
                            rule:
                              allOf: [{ $ref: '#/components/schemas/CostRulePreviewMatch' }]
                            applied_rules:
                              type: array
                              items: { $ref: '#/components/schemas/CostRulePreviewMatch' }
                            match_mode: { type: string }
                            calculation:
                              type: object
                              additionalProperties: true
        '400': { description: Invalid SKU batch. }
        '401': { description: Unauthenticated. }
        '403': { description: Missing catalog read capability. }
  /oa-api/orders/cost-requests:
    post:
      summary: 在当前可见店铺发起 SKU 成本核对
      description: 只核验筛选期间的真实订单行并创建消息。同一发起人、店铺、编码已有待办时复用。不会更改成本或订单。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shop_id, sku, from, to, reason, request_key]
              properties:
                shop_id: {type: string}
                sku: {type: string}
                from: {type: string, format: date}
                to: {type: string, format: date}
                include_brush: {type: boolean}
                reason: {type: string, minLength: 1, maxLength: 300}
                request_key: {type: string, minLength: 16, maxLength: 80}
      responses:
        '200':
          description: 核价请求的消息编号及是否复用
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: {type: integer, format: int64}
                      existing: {type: boolean}
        '400': {description: 请求内容或范围无效}
        '403': {description: 无经营或店铺权限}
        '404': {description: 指定范围内没有该 SKU}
        '503': {description: 服务暂不可用}
    get:
      summary: 获取自己的成本请求或成本维护队列
      parameters:
      - {name: queue, in: query, schema: {type: string, enum: [mine, replies, pending], default: mine}}
      - {name: summary, in: query, schema: {type: string, enum: ['1']}, description: 仅返回准确计数}
      - {name: before, in: query, schema: {type: integer, minimum: 1}, description: 上一页末条消息编号}
      responses:
        '200':
          description: 我的未读回复数和可处理的待办数；列表每页最多二十条
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pending_count: {type: integer}
                      reply_count: {type: integer}
                      can_handle: {type: boolean}
                      has_more: {type: boolean}
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: integer, format: int64}
                            created_at: {type: string, format: date-time}
                            unread: {type: boolean}
                            kind: {type: string, enum: [sku_cost_request]}
                            state: {type: string, enum: [pending, handled]}
                            sku: {type: string}
                            shop_id: {type: string}
                            reason: {type: string}
                            sender: {type: string}
                            handled_at: {type: string, format: date-time}
                            handled_by: {type: string}
                            reply: {type: string}
        '403': {description: 无维护工作队列权限}
  /oa-api/orders/cost-requests/{id}/resolve:
    parameters:
    - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    post:
      summary: 向发起人回复成本核对结果并关闭待办
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reply]
              properties:
                reply: {type: string, minLength: 1, maxLength: 300}
      responses:
        '200': {description: 核对消息已办结}
        '403': {description: 无成本维护权限}
        '409': {description: 请求已办理或不存在}
  /oa-api/orders/cost-requests/{id}/read:
    parameters:
    - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    post:
      summary: 发起人将自己的核对回复标为已读
      responses:
        '200': {description: 已处理读标记}
  /oa-api/orders/summary:
    get:
      summary: 经营汇总
      description: 默认按店日使用 v_shop_day；纳入刷单改读有效订单。无明确核实成本时金额可为空。
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: 含起日，北京时间；不得早于 2026-06-01
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: 含止日，北京时间；不得晚于今天
      - in: query
        name: shop_id
        schema:
          type: string
      - in: query
        name: platform
        schema:
          type: string
        description: 省略时仅默认电商范围，排除线下店铺和其它平台
      - in: query
        name: include_brush
        schema:
          type: string
          enum:
          - '0'
          - '1'
        description: 1 表示纳入刷单
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/OrderResult'
                    - type: object
                      properties:
                        rows:
                          type: array
                          items:
                            type: object
                            properties:
                              day:
                                type: string
                                format: date
                              shop_id:
                                type: string
                              platform:
                                type: string
                              order_count: &id001
                                type: string
                                pattern: ^[0-9]+$
                                description: ClickHouse JSON UInt64 decimal string
                              payable_amount:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                              item_pay_total:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                              item_pay_verified_total:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                              cost_verified_total:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                                nullable: true
                              verified_gross:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                                nullable: true
                              verified_coverage:
                                type: number
                                nullable: true
                              verified_status:
                                type: string
                required:
                - data
          headers:
            X-OA-Order-Cache:
              description: OA 应用查询缓存状态。范围为空时可省略，与 ClickHouse 查询缓存独立。
              schema:
                type: string
                enum:
                - hit
                - miss
                - coalesced
                - stale
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '503':
          $ref: '#/components/responses/HTTP503'
        '504':
          $ref: '#/components/responses/HTTP504'
  /oa-api/orders/products:
    get:
      summary: 分页商品经营
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: 含起日，北京时间；不得早于 2026-06-01
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: 含止日，北京时间；不得晚于今天
      - in: query
        name: shop_id
        schema:
          type: string
      - in: query
        name: platform
        schema:
          type: string
        description: 省略时仅默认电商范围，排除线下店铺和其它平台
      - in: query
        name: include_brush
        schema:
          type: string
          enum:
          - '0'
          - '1'
        description: 1 表示纳入刷单
      - in: query
        name: sku
        schema:
          type: string
      - in: query
        name: product
        schema:
          type: string
      - in: query
        name: mine
        schema:
          type: string
          enum:
          - '0'
          - '1'
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          maximum: 10000
        description: 每页最多 100 条；has_more 指示后续页
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/OrderResult'
                    - type: object
                      properties:
                        rows:
                          type: array
                          items:
                            type: object
                            properties:
                              shop_id:
                                type: string
                              sku:
                                type: string
                              product_name:
                                type: string
                              shop_item_id:
                                type: string
                                nullable: true
                              quantity:
                                type: string
                              item_pay_total:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                              item_pay_verified_total:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                              cost_verified_total:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                                nullable: true
                              verified_gross:
                                type: string
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                description: 精确十进制金额字符串
                                nullable: true
                              verified_coverage:
                                type: number
                                nullable: true
                required:
                - data
          headers:
            X-OA-Order-Cache:
              description: OA 应用查询缓存状态。范围为空时可省略，与 ClickHouse 查询缓存独立。
              schema:
                type: string
                enum:
                - hit
                - miss
                - coalesced
                - stale
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '503':
          $ref: '#/components/responses/HTTP503'
        '504':
          $ref: '#/components/responses/HTTP504'
  /oa-api/orders/rankings:
    get:
      summary: 经营排行
      description: |
        当前账号可见范围内先分组、排序、分页，再关联名称。店铺按 shop_id，宝贝按 shop_id 加 shop_item_id，SKU 按 shop_id 加 sku_id，人员按 person_id。
        人员排行限超级管理员；同一商品行可归属多人。增长基期为等长紧邻区间，零基期不计算增长率。
        缺值排在末尾，同值按完整分组键升序。稳定数据区间内跨页不重复、不漏行。在途同步可能改变不同请求所见数据。
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: 含起日，北京时间；不得早于 2026-06-01
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: 含止日，北京时间；不得晚于今天
      - in: query
        name: shop_id
        schema:
          type: string
      - in: query
        name: platform
        schema:
          type: string
        description: 省略时仅默认电商范围，排除线下店铺和其它平台
      - in: query
        name: include_brush
        schema:
          type: string
          enum:
          - '0'
          - '1'
        description: 1 表示纳入刷单
      - in: query
        name: group
        schema:
          type: string
          enum:
          - shop
          - platform
          - product
          - person
          - growth
          - sku
      - in: query
        name: sort
        schema: { type: string, enum: [amount, count, gross, grossRate, growth, quantity] }
        description: |
          amount 对店铺、平台和增长榜为应付，对宝贝、SKU、人员为商品销售额。
          count、gross 和 grossRate 仅适用店铺、平台和增长榜；growth 仅适用增长榜，quantity 仅适用 SKU 榜。
          缺省取 amount，增长榜缺省取 growth。非法字段及不适用的组合返回 400。
      - in: query
        name: order
        schema: { type: string, enum: [asc, desc], default: desc }
        description: 数据库在分页前排序。仅接受小写 asc 或 desc。
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          maximum: 4294967295
        description: 每页最多 100 条；total_rows 为筛选后分组总数，has_more 指示后续页
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/OrderResult'
                    - type: object
                      properties:
                        total_rows:
                          type: integer
                          format: int64
                          description: 包括末页和越界空页在内，均返回所选范围的总组数。
                        rows:
                          type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                              shop_id:
                                type: string
                              shop_item_id:
                                type: string
                                description: 宝贝榜平台宝贝 ID；key 仍返回相同标识。
                              title:
                                type: string
                                description: 宝贝榜当前在 v_listings 的标题，按店铺和宝贝 ID 关联；缺名回退至宝贝 ID。
                              person_id:
                                type: string
                              name:
                                type: string
                                description: 人员榜名册姓名，缺名回退至 person_id。
                              archived:
                                type: integer
                                enum: [0, 1, null]
                                nullable: true
                                description: 1 为已归档；未找到名册记录时为 null。
                              sku:
                                type: string
                              sku_id:
                                type: string
                              product_name:
                                type: string
                                description: 仅 SKU 榜的 SKU 名称。
                              quantity:
                                type: string
                              platform:
                                type: string
