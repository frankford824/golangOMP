components:
  securitySchemes:
    OABrowserSession:
      type: apiKey
      in: cookie
      name: __Host-yb-oa-session
      description: OA 浏览器会话由 OA 入口验证，核心服务继续校验主站正式会话。
    MainBearer:
      type: http
      scheme: bearer
      description: 正式纯 API 客户端的 Bearer 凭证，请勿同时发送 OA 会话 Cookie。浏览器仅在迁移入口提交旧凭证。
  schemas:
    OARecipientAccount:
      type: object
      properties:
        id: &id001
          type: string
        holder: *id001
        bank: *id001
        last_four: *id001
        version: &id002
          type: integer
          format: int64
          minimum: 0
    OARecipientInput:
      type: object
      properties:
        scope:
          type: string
          enum:
          - personal
          - supplier
        holder: *id001
        bank: *id001
        account:
          type: string
          writeOnly: true
