  /oa-api/people/roster:
    get:
      summary: 分页读取授权人员名册
      description: 需要 people.manage 并按有效组织范围过滤。
      parameters:
      - in: query
        name: page
        description: 页码从 1 开始。
        schema:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - in: query
        name: q
        description: 匹配姓名或工号。
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - disabled
      - in: query
        name: hr_status
        schema:
          type: string
          enum: [active, probation, regular, leaving, left, disabled]
      - in: query
        name: department_id
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: team_id
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: employment_type
        schema:
          type: string
      - in: query
        name: missing
        description: 筛选未记录直属负责人、入职日期或工号。
        schema:
          type: string
          enum:
          - manager
          - joined
          - employee_no
      - in: query
        name: sort
        description: 可选排序字段。留空按人员 ID 升序；选择字段时缺项始终在末尾，同值按人员 ID 升序。
        schema:
          type: string
          enum: [name, employee_no, joined]
      - in: query
        name: direction
        description: 排序方向。仅在提供 sort 时传入；使用 sort 且省略 direction 时按升序。
        schema:
          type: string
          enum: [asc, desc]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - items
                    - total
                    - page
                    - page_size
                    - completeness
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Person'
                      total:
                        type: integer
                      page:
                        type: integer
                      page_size:
                        type: integer
                      completeness:
                        description: Counts within the other filters, before applying the missing filter.
                        type: object
                        required: [manager, joined, employee_no]
                        properties:
                          manager: {type: integer, minimum: 0}
                          joined: {type: integer, minimum: 0}
                          employee_no: {type: integer, minimum: 0}
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '500':
          $ref: '#/components/responses/HTTP500'
        '503':
          $ref: '#/components/responses/HTTP503'
