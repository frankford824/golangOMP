components:
  securitySchemes:
    MainBearer:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    Actor:
      type: object
      properties:
        id:
          type: integer
          format: int64
        department_id:
          type: integer
          format: int64
        team_id:
          type: integer
          format: int64
        name:
          type: string
        department:
          type: string
        team:
          type: string
        employee_no:
          type: integer
          nullable: true
        activated:
          type: boolean
        super_admin:
          type: boolean
        roles:
          type: array
          items:
            type: string
        actions:
          type: object
          additionalProperties:
            type: boolean
        people_departments:
          type: array
          items:
            type: integer
            format: int64
        people_teams:
          type: array
          items:
            type: integer
            format: int64
    Freshness:
      type: object
      properties:
        source_committed_at:
          type: string
          description: 北京时间，YYYY-MM-DD HH:mm:ss
          example: '2026-11-18 10:30:15'
        lag_seconds:
          type: integer
      nullable: true
    Feedback:
      type: object
      properties:
        id:
          type: integer
          format: int64
        shop_id:
          type: string
        sku:
          type: string
        note:
          type: string
        adjusted_on:
          type: string
          format: date
        task_id:
          type: integer
          format: int64
          nullable: true
    TaskLink:
      type: object
      properties:
        id:
          type: integer
          format: int64
        task_no:
          type: string
        status:
          type: string
    OrderResult:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        freshness:
          $ref: '#/components/schemas/Freshness'
        stale:
          type: boolean
        has_more:
          type: boolean
    Person:
      type: object
      properties:
        id:
          type: integer
          format: int64
        department_id:
          type: integer
          format: int64
        team_id:
          type: integer
          format: int64
        manager_id:
          type: integer
          format: int64
        name:
          type: string
        department:
          type: string
        team:
          type: string
        status:
          type: string
        employment_type:
          type: string
        joined:
          type: string
        left:
          type: string
        management:
          type: string
        employee_no:
          type: integer
          nullable: true
        roles:
          type: array
          items:
            type: string
        version:
          type: integer
        events:
          type: array
          items:
            $ref: '#/components/schemas/PersonChange'
        terms:
          type: array
          items:
            type: object
            properties:
              shop_id:
                type: string
              from:
                type: string
                format: date
              to:
                type: string
              pending_handover:
                type: boolean
    PersonChange:
      type: object
      properties:
        kind:
          type: string
        shop_id:
          type: string
        from_shop_id:
          type: string
        management:
          type: string
        employment_type:
          type: string
        effective_date:
          type: string
          format: date
        department_id:
          type: integer
          format: int64
        team_id:
          type: integer
          format: int64
        target_id:
          type: integer
          format: int64
        manager_id:
          type: integer
          format: int64
        actor_id:
          type: integer
          format: int64
        roles:
          type: array
          items:
            type: string
        version:
          type: integer
    RosterRow:
      type: object
      properties:
        sheet:
          type: string
        name:
          type: string
        error:
          type: string
        employment_type:
          type: string
        previous_name:
          type: string
        new_name:
          type: string
        result:
          type: string
        failure:
          type: string
        shop_id:
          type: string
        from:
          type: string
        row:
          type: integer
        version:
          type: integer
        employee_no:
          type: integer
        previous_employee_no:
          type: integer
        id:
          type: integer
          format: int64
    Template:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        evidence:
          type: string
        extra:
          type: string
        channels:
          type: array
          items:
            type: string
        fields:
          type: array
          items:
            type: string
        required:
          type: array
          items:
            type: string
        nodes:
          type: array
          items:
            type: string
        threshold_cents:
          type: integer
          format: int64
        version:
          type: integer
    Application:
      type: object
      properties:
        request_id:
          type: string
        template_id:
          type: string
        reason:
          type: string
        channel:
          type: string
        holder:
          type: string
        account:
          type: string
        bank:
          type: string
        site:
          type: string
        amount_cents:
          type: integer
          format: int64
        extra:
          type: object
          additionalProperties:
            type: string
        files:
          type: array
          items:
            type: string
      required:
      - request_id
      - template_id
      - amount_cents
      - reason
      - channel
    Payment:
      type: object
      properties:
        amount_cents:
          type: integer
          format: int64
        date:
          type: string
          format: date
        receipt:
          type: string
      required:
      - amount_cents
      - date
      - receipt
    Document:
      allOf:
      - $ref: '#/components/schemas/Application'
      - type: object
        properties:
          id:
            type: string
          applicant_id:
            type: integer
            format: int64
          template:
            $ref: '#/components/schemas/Template'
          state:
            type: string
          route:
            type: array
            items:
              type: integer
              format: int64
          current:
            type: integer
          version:
            type: integer
          history:
            type: array
            items:
              type: object
              properties:
                actor_id:
                  type: integer
                  format: int64
                action:
                  type: string
                comment:
                  type: string
                at:
                  type: string
                  format: date-time
          payment:
            type: object
            properties:
              amount_cents:
                type: integer
                format: int64
              date:
                type: string
                format: date
              receipt:
                type: string
            nullable: true
  responses:
    HTTP503:
      description: 数据、授权或扩展服务暂不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    HTTP401:
      description: 主站会话缺失或失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    HTTP403:
      description: 当前账号或数据范围无权访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    HTTP400:
      description: 参数、文件或请求状态不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    HTTP504:
      description: 订单源查询超时
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    HTTP404:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    HTTP409:
      description: 版本、状态或幂等冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    HTTP500:
      description: 扩展操作失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
