                              format: int64
                            name:
                              type: string
                            department:
                              type: string
                            employee_no:
                              type: integer
                              nullable: true
                      next_after_id: { type: integer, format: int64, minimum: 0, description: 下一页位置，0 表示已读取全部 }
                      selected:
