  /oa-api/finance/approvers:
    get:
      summary: 列出审批候选
      description: 模板维护人按现有授权范围查询在职候选；超级管理员和公司级费用管理员也可在委托模板和分配财务权限时核对目标账号。候选按账号 ID 分页，每页最多 50 人，已选回查独立于分页。返回账号 ID、姓名、工号和部门。
      parameters:
      - in: query
        name: q
        description: 按姓名、部门或工号搜索
        schema:
          type: string
      - in: query
        name: ids
        description: 最多 16 个逗号分隔的正整数账号 ID，用于回查已选审批人
        schema:
          type: string
      - in: query
        name: after_id
        description: 上一页返回的非零 next_after_id，首页省略
        schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              format: int64
                            name:
                              type: string
                            department:
                              type: string
                            employee_no:
                              type: integer
                              nullable: true
                      next_after_id: { type: integer, format: int64, minimum: 0, description: 下一页位置，0 表示已读取全部 }
