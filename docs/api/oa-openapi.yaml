components:
  securitySchemes:
    MainBearer:
      type: http
      scheme: bearer
  schemas:
    OAFinanceActivityItem:
      type: object
      required: [id, notification_type, payload, created_at, unread]
      properties:
        id:
          type: integer
          format: int64
          description: 处理结果的事件编号。待办由单据状态生成，编号为 0，使用 payload.document_id 标识。
        notification_type: { type: string, enum: [oa_finance_document] }
        unread:
          type: boolean
          description: 是否为未读处理结果。待办恒为 false。
        payload:
          type: object
          required: [document_id, state, title, kind]
          properties:
            document_id: { type: string }
            state: { type: string, enum: [waiting, approved, returned, rejected, paid] }
            title: { type: string }
            kind: { type: string, enum: [approve, pay, revise, result] }
        created_at:
          type: string
          description: 待办使用单据最近流转时间，处理结果使用事件记录时间。
    # Cost rule evidence fields mirror the core rule-preview contract.
    CostRulePreviewMatch:
      type: object
      properties:
        rule_id:
          type: integer
        rule_name:
          type: string
        rule_version:
          type: integer
        rule_type:
          $ref: '#/components/schemas/CostRuleType'
        priority:
          type: integer
        source:
          type: string
        governance_status:
          $ref: '#/components/schemas/CostRuleGovernanceStatus'
    CostRuleType:
      type: string
      enum:
      - cost_model
      - fixed_unit_price
      - area_threshold_surcharge
      - minimum_billable_area
      - size_based_formula
      - manual_quote
      - special_process_surcharge
    CostRuleGovernanceStatus:
      type: string
      description: Governance/effective-window status for one persisted cost-rule row.
        This is not an approval-state machine.
      enum:
      - inactive
      - scheduled
      - effective
      - expired
      - no_match
    CostRulePreviewRequest:
      type: object
      properties:
        model:
          allOf:
          - $ref: '#/components/schemas/CostModel'
          description: Optional unsaved model for read-only simulation. Never saved or
            bound by this operation.
        input:
          $ref: '#/components/schemas/CostInput'
        category_id:
          type: integer
          nullable: true
        category_code:
          type: string
        width:
          type: number
          format: double
          nullable: true
          description: Width in metres for rule-preview calculations.
        height:
          type: number
          format: double
          nullable: true
          description: Height in metres for rule-preview calculations.
        area:
          type: number
          format: double
          nullable: true
          description: Billable area in square metres.
        quantity:
          type: integer
          format: int64
          nullable: true
        process:
          type: string
        notes:
          type: string
        erp_i_id:
          type: string
          description: ERP item identifier used for exact governed-rule binding.
        product_i_id:
          type: string
          description: Product item identifier used for exact governed-rule binding when
            ERP i_id is absent.
    CostInput:
      type: object
      description: Structured inputs for one SKU sales unit. Total/layout/face-list areas
        already include all pieces. Order quantity never multiplies the resulting SKU
        unit cost. Stored in SKU variant_json.cost_input; patch via cost_input.
      properties:
        area_mode:
          type: string
          enum:
          - flat
          - faces
          - layout
          - total
        width_m:
          type: number
          minimum: 0
        height_m:
          type: number
          minimum: 0
        depth_m:
          type: number
          minimum: 0
        area_m2:
          type: number
          minimum: 0
        thickness_mm:
          type: number
          minimum: 0
        shape:
          type: string
          enum:
          - ''
          - normal
          - irregular
          description: Explicit shape selection. A variant price table requires normal
            or irregular; missing shape never defaults to normal. Free text is never used
            to infer shape or its billable area.
        pieces:
          type: integer
          minimum: 1
          maximum: 100000
        faces:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CostFace'
        processes:
          type: object
          description: Explicit slot, punch, laminate, double_sided choices. Missing configured
            choices require confirmation; prose is never used to guess these values.
          additionalProperties:
            type: boolean
        hole_count:
          type: integer
          minimum: 0
          maximum: 100000
        process_length_m:
          type: number
          minimum: 0
    CostFace:
      type: object
      required:
      - width_m
      - height_m
      - count
      properties:
        width_m:
          type: number
          minimum: 0
          exclusiveMinimum: true
        height_m:
          type: number
          minimum: 0
          exclusiveMinimum: true
        count:
          type: integer
          minimum: 1
          maximum: 100000
    CostModel:
      type: object
      description: Bounded model configuration, persisted as JSON in formula_expression
        when rule_type=cost_model. One active model per matched group is allowed at evaluation;
        multiple models fail closed. Model replaces legacy components in that group. Source
        names are provenance, not approval.
      required:
      - version
      - material
      - basis
      - unit_price
      - multiplier
      properties:
        version:
          type: integer
          enum:
          - 1
        material:
          type: string
          minLength: 1
        basis:
          type: string
          enum:
          - area
          - piece
          - set
          - manual
        unit_price:
          type: number
          minimum: 0
        multiplier:
          type: number
          minimum: 0
          exclusiveMinimum: true
        minimum:
          type: number
          minimum: 0
        small_area_threshold:
          type: number
          minimum: 0
        small_area_surcharge:
          type: number
          minimum: 0
        thickness_prices:
          type: array
          maxItems: 32
          items:
            type: object
            required:
            - thickness_mm
            - unit_price
            properties:
              thickness_mm:
                type: number
                minimum: 0
                exclusiveMinimum: true
              unit_price:
                type: number
                minimum: 0
        variant_prices:
          type: array
          maxItems: 32
          description: Optional replacement unit prices by exact thickness and explicit
            shape. Mutually exclusive with thickness_prices. A single row with thickness_mm=0
            means no thickness distinction and cannot coexist with other rows. A null
            price remains unquoted; zero explicitly means free. When configured, unit_price
            is ignored and unmatched thickness, missing shape or an unquoted cell requires
            manual review. Existing models without this table keep their prior calculation
            for unchanged inputs.
          items:
            type: object
            required:
            - thickness_mm
            - normal_price
            - irregular_price
            properties:
              thickness_mm:
                type: number
                minimum: 0
              normal_price:
                type: number
                minimum: 0
                nullable: true
              irregular_price:
                type: number
                minimum: 0
                nullable: true
        processes:
          type: array
          maxItems: 8
          items:
            type: object
            required:
            - code
            - unit
            - unit_price
            - multiplier
            properties:
              code:
                type: string
                enum:
                - slot
                - punch
                - laminate
                - double_sided
              unit:
                type: string
                enum:
                - sku
                - piece
                - hole
                - metre
                - area
              unit_price:
                type: number
                minimum: 0
              multiplier:
                type: number
                minimum: 0
                exclusiveMinimum: true
    Error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    Actor:
      type: object
      properties:
        id:
          type: integer
          format: int64
        department_id:
          type: integer
          format: int64
        team_id:
          type: integer
          format: int64
        name:
          type: string
        department:
          type: string
        team:
          type: string
        employee_no:
          type: integer
          nullable: true
        activated:
          type: boolean
        super_admin:
          type: boolean
        roles:
          type: array
          items:
            type: string
        actions:
          type: object
          additionalProperties:
            type: boolean
        people_departments:
          type: array
          items:
            type: integer
            format: int64
        people_teams:
          type: array
          items:
            type: integer
            format: int64
    Freshness:
      type: object
      properties:
        source_committed_at:
          type: string
          description: 北京时间，YYYY-MM-DD HH:mm:ss
          example: '2026-11-18 10:30:15'
        lag_seconds:
          type: integer
      nullable: true
    Feedback:
      type: object
      properties:
        id:
          type: integer
          format: int64
        shop_id:
          type: string
        sku:
          type: string
        note:
          type: string
        adjusted_on:
          type: string
          format: date
        task_id:
          type: integer
          format: int64
          nullable: true
    TaskLink:
      type: object
      properties:
        id:
          type: integer
          format: int64
        task_no:
          type: string
        status:
          type: string
    ShopBindingView:
      type: object
      required: [version, editable, match, shops]
      properties:
        version:
          type: integer
          minimum: 0
        editable:
          type: boolean
        match:
          type: string
          enum: [matched, missing_employee, unmatched]
        shops:
          type: array
          items:
            type: object
            required: [shop_id, shop_name, platform, selectable, baseline, visible]
            properties:
              shop_id:
                type: string
              shop_name:
                type: string
              platform:
                type: string
              selectable:
                type: boolean
              baseline:
                type: boolean
              override:
                type: string
                enum: [granted, revoked]
              visible:
                type: boolean
                description: 范围开放状态；默认经营查询仍应用平台范围
    OrderResult:
      type: object
      properties:
        scope_state:
          type: string
          enum:
          - unassigned
          description: 当前账号未映射到可访问店铺，或个人查询未匹配唯一人员归属；有范围但无成交时不返回该字段
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        freshness:
          $ref: '#/components/schemas/Freshness'
        stale:
          type: boolean
        has_more:
          type: boolean
    Person:
      type: object
      properties:
        id:
          type: integer
          format: int64
        department_id:
          type: integer
          format: int64
        team_id:
          type: integer
          format: int64
        manager_id:
          type: integer
          format: int64
        name:
          type: string
        department:
          type: string
        team:
          type: string
        status:
          type: string
        employment_type:
          type: string
        joined:
          type: string
        left:
          type: string
        management:
          type: string
        employee_no:
          type: integer
          nullable: true
        roles:
          type: array
          items:
            type: string
        version:
          type: integer
        events:
          type: array
          items:
            $ref: '#/components/schemas/PersonChange'
        terms:
          type: array
          items:
            type: object
            properties:
              shop_id:
                type: string
              from:
                type: string
                format: date
              to:
                type: string
              pending_handover:
                type: boolean
    PersonChange:
      type: object
      properties:
        kind:
          type: string
        shop_id:
          type: string
        from_shop_id:
          type: string
        management:
          type: string
        employment_type:
          type: string
        effective_date:
          type: string
          format: date
        department_id:
          type: integer
          format: int64
        team_id:
          type: integer
          format: int64
        target_id:
          type: integer
          format: int64
        manager_id:
          type: integer
          format: int64
        actor_id:
          type: integer
          format: int64
        roles:
          type: array
          items:
            type: string
        version:
          type: integer
    RosterRow:
      type: object
      properties:
        sheet:
          type: string
        name:
          type: string
        error:
          type: string
        employment_type:
          type: string
        previous_name:
          type: string
        new_name:
          type: string
        result:
          type: string
        failure:
          type: string
        shop_id:
          type: string
        from:
          type: string
        row:
          type: integer
        version:
          type: integer
        employee_no:
          type: integer
        previous_employee_no:
          type: integer
        id:
          type: integer
          format: int64
    Template:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        evidence:
          type: string
        extra:
          type: string
        channels:
          type: array
          items:
            type: string
        fields:
          type: array
          items:
            type: string
        required:
          type: array
          items:
            type: string
        nodes:
          type: array
          items:
            type: string
        threshold_cents:
          type: integer
          format: int64
        version:
          type: integer
    Application:
      type: object
      properties:
        request_id:
          type: string
        template_id:
          type: string
        reason:
          type: string
        channel:
