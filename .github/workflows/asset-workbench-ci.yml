name: Asset Workbench CI

on:
  pull_request:
    branches:
      - dev/external-developer
    paths:
      - 'vue/src/asset-workbench/**'
      - 'vue/scripts/asset-workbench-*.mjs'
      - 'vue/package.json'
      - 'vue/package-lock.json'
      - 'vue/tsconfig.asset.json'
      - 'vue/vite.asset.config.ts'
      - '.github/workflows/asset-workbench-ci.yml'
  push:
    branches:
      - dev/external-developer
    paths:
      - 'vue/src/asset-workbench/**'
      - 'vue/scripts/asset-workbench-*.mjs'
      - 'vue/package.json'
      - 'vue/package-lock.json'
      - 'vue/tsconfig.asset.json'
      - 'vue/vite.asset.config.ts'
      - '.github/workflows/asset-workbench-ci.yml'

permissions:
  contents: read

jobs:
  asset-workbench:
    name: Asset workbench frontend gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vue/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Architecture audit
        run: npm run asset:audit

      - name: Type check
        run: npx vue-tsc -p tsconfig.asset.json --noEmit

      - name: Focused unit tests
        run: npm run test -- src/asset-workbench/app/access.test.ts src/asset-workbench/shared/composables/usePageRequest.test.ts src/asset-workbench/shared/ui/AsyncBoundary.test.ts

      - name: Accessibility audit
        run: npm run asset:a11y

      - name: Visual comparison report
        run: npm run asset:visual:compare

      - name: Asset build
        run: npm run build:asset
