# Production config for the independent asset workbench frontend.
# Requires TLS certificate SAN covering assets.yongbo.cloud.

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name assets.yongbo.cloud;

    ssl_certificate /etc/letsencrypt/live/assets.yongbo.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assets.yongbo.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/assets.yongbo.cloud;
    index asset.html;

    client_max_body_size 1g;
    client_body_timeout 300s;
    limit_conn yongbo_conn_per_ip 80;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml font/woff2;

    location = /asset.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Backend-authorized AList byte stream. The public request first reaches
    # /v1/assets/{ext-id}/content; only X-Accel-Redirect can enter this path.
    location ^~ /_protected/external-alist/p/ {
        internal;
        proxy_pass http://100.111.214.38:5244/p/;
        proxy_http_version 1.1;
        proxy_set_header Host 100.111.214.38:5244;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_force_ranges on;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v1/auth/login {
        limit_req zone=yongbo_login_per_ip burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location ~ ^/v1/auth/(?:me|asset-cookie|logout)$ {
        limit_req zone=yongbo_auth_per_ip burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location ~ ^/v1/public/erp-product-images/[0-9]+$ {
        limit_req zone=yongbo_public_image_per_ip burst=400 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        expires 10m;
        add_header Cache-Control "public, max-age=600" always;
    }

    location ~ ^/v1/asset-workbench/(?:files|client-materials|system-assets)/[0-9]+/(?:preview|download)$ {
        limit_req zone=yongbo_asset_per_ip burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location /v1/ {
        limit_req zone=yongbo_api_per_ip burst=80 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location = /v1 {
        return 301 /v1/;
    }

    location ^~ /ws/ {
        limit_req zone=yongbo_ws_per_ip burst=20 nodelay;
        limit_conn yongbo_conn_per_ip 20;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $yongbo_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /asset.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name assets.yongbo.cloud;
    return 301 https://assets.yongbo.cloud$request_uri;
}
