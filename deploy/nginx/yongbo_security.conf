# Yongbo origin protection zones.
# Install under /etc/nginx/conf.d/ so these directives live in the nginx http context.

server_tokens off;

# Keep the original visitor IP after yongbo.cloud is proxied by Cloudflare.
# These trusted ranges are only used when the TCP peer is Cloudflare; direct
# origin traffic cannot spoof CF-Connecting-IP from arbitrary addresses.
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

limit_req_status 429;
limit_conn_status 429;

limit_conn_zone $binary_remote_addr zone=yongbo_conn_per_ip:20m;
limit_req_zone $binary_remote_addr zone=yongbo_api_per_ip:20m rate=8r/s;
limit_req_zone $binary_remote_addr zone=yongbo_login_per_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=yongbo_asset_per_ip:20m rate=3r/s;
limit_req_zone $binary_remote_addr zone=yongbo_upload_per_ip:20m rate=2r/s;
limit_req_zone $binary_remote_addr zone=yongbo_ws_per_ip:10m rate=30r/m;

map $http_upgrade $yongbo_connection_upgrade {
    default upgrade;
    '' close;
}
