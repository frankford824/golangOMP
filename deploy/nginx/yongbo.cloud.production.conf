# 已签发 Let's Encrypt 后的生产配置（jst_ecs）
# 证书包含 yongbo.cloud / www.yongbo.cloud；www 在 80/443 都跳转到 https://yongbo.cloud

upstream yongbo_main_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream yongbo_upload_service {
    server 100.111.214.38:8089;
    keepalive 32;
}

server {
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    server_name yongbo.cloud;

    ssl_certificate /etc/letsencrypt/live/yongbo.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yongbo.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/yongbo.cloud;
    index index.html;

    client_max_body_size 1g;
    client_body_timeout 300s;
    limit_conn yongbo_conn_per_ip 80;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Backend-authorized AList byte stream. The public request first reaches
    # /v1/assets/{ext-id}/content; only X-Accel-Redirect can enter this path.
    location ^~ /_protected/external-alist/p/ {
        internal;
        proxy_pass http://100.111.214.38:5244/p/;
        proxy_http_version 1.1;
        proxy_set_header Host 100.111.214.38:5244;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_force_ranges on;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }

    # Backend-authorized BFF byte stream. Prefer this path when the BFF is
    # configured because it normalizes Quark provider responses for browsers.
    location = /_protected/external-bff/api/fetch {
        internal;
        proxy_pass http://100.111.214.38:8080/api/fetch;
        proxy_http_version 1.1;
        proxy_set_header Host 100.111.214.38:8080;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Content-Disposition;
        proxy_force_ranges on;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }

    # Business file proxy paths can end with image/font-like extensions. Keep
    # them in the API upstream instead of letting the static asset regex below
    # short-circuit them to the frontend document root.
    location ^~ /v1/assets/files/ {
        limit_req zone=yongbo_asset_per_ip burst=20 nodelay;
        proxy_pass http://yongbo_main_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /health {
        proxy_pass http://yongbo_main_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /ping {
        proxy_pass http://yongbo_main_api/ping;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v1/auth/login {
        limit_req zone=yongbo_login_per_ip burst=10 nodelay;
        proxy_pass http://yongbo_main_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Session recovery must not share the ordinary API bucket with image-heavy
    # pages. Otherwise a thumbnail burst can make a successful login look like
    # an expired session when the immediate /auth/me request is throttled.
    location ~ ^/v1/auth/(?:me|asset-cookie|logout)$ {
        limit_req zone=yongbo_auth_per_ip burst=60 nodelay;
        proxy_pass http://yongbo_main_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Signed ERP thumbnails are browser image traffic, not ordinary JSON API
    # calls. Large result grids legitimately request hundreds at once.
    location ~ ^/v1/public/erp-product-images/[0-9]+$ {
        limit_req zone=yongbo_public_image_per_ip burst=400 nodelay;
        proxy_pass http://yongbo_main_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        expires 10m;
        add_header Cache-Control "public, max-age=600" always;
    }

    location ~ ^/v1/assets/[0-9]+/(preview|download)$ {
        limit_req zone=yongbo_asset_per_ip burst=40 nodelay;
        proxy_pass http://yongbo_main_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location /v1/ {
        limit_req zone=yongbo_api_per_ip burst=80 nodelay;
        proxy_pass http://yongbo_main_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location = /v1 {
        return 301 /v1/;
    }

    location ^~ /ws/ {
        limit_req zone=yongbo_ws_per_ip burst=20 nodelay;
        limit_conn yongbo_conn_per_ip 20;
        proxy_pass http://yongbo_main_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $yongbo_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location ^~ /upload/ {
        limit_req zone=yongbo_upload_per_ip burst=30 nodelay;
        limit_conn yongbo_conn_per_ip 20;
        proxy_pass http://yongbo_upload_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location = /upload {
        return 301 /upload/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name www.yongbo.cloud;

    ssl_certificate /etc/letsencrypt/live/yongbo.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yongbo.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://yongbo.cloud$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.yongbo.cloud;
    return 301 https://yongbo.cloud$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name yongbo.cloud;
    return 301 https://yongbo.cloud$request_uri;
}
