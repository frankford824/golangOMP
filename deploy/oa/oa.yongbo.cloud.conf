limit_req_zone $binary_remote_addr zone=oa_login_per_ip:1m rate=10r/m;
server {
    listen 80;
    listen [::]:80;
    server_name oa.yongbo.cloud;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / { return 301 https://oa.yongbo.cloud$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oa.yongbo.cloud;
    ssl_certificate /etc/letsencrypt/live/oa.yongbo.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oa.yongbo.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /srv/yongbo-oa/current/web;
    index oa.html;
    client_max_body_size 32m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /v1/auth/login {
        limit_req zone=oa_login_per_ip burst=10 nodelay;
        proxy_pass http://127.0.0.1:18085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /v1/ {
        proxy_pass http://127.0.0.1:18085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ignore_headers X-Accel-Redirect;
    }
    # Invitation-only sandbox with an approved live read-only data source.
    location = /v1/auth/register { return 403; }
    location = /v1/asset-workbench/register { return 403; }
    location /ws {
        proxy_pass http://127.0.0.1:18087;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /oa-objects/ {
        client_max_body_size 128m;
        access_log off;
        proxy_pass http://127.0.0.1:18089;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /oa-api/ {
        proxy_pass http://127.0.0.1:18085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie "";
        proxy_read_timeout 65s;
    }
    location = /oa.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /oa.html; }
}
